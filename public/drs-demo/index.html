<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verse DRS Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — top bar, project side menu, content area of shadcn/ui cards and tables.
   Every colour is a Radix Colors step; amber is reserved for actions that move material. */
:root{
  --slate-1:#fcfcfd;--slate-2:#f9f9fb;--slate-3:#f0f0f3;--slate-4:#e8e8ec;--slate-5:#e0e1e6;--slate-6:#d9d9e0;--slate-7:#cdced6;--slate-8:#b9bbc6;--slate-9:#8b8d98;--slate-10:#80838d;--slate-11:#60646c;--slate-12:#1c2024;
  --amber-2:#fefbe9;--amber-3:#fff7c2;--amber-4:#ffee9c;--amber-6:#f3d673;--amber-7:#e9c162;--amber-9:#ffc53d;--amber-10:#ffba18;--amber-11:#ab6400;--amber-12:#4f3422;
  --green-3:#e6f6eb;--green-6:#b4dfc4;--green-9:#30a46c;--green-11:#218358;
  --orange-3:#ffefd6;--orange-6:#ffc182;--orange-9:#f76b15;--orange-11:#cc4e00;
  --red-3:#feebec;--red-6:#fdbdbe;--red-9:#e5484d;--red-11:#ce2c31;
  --blue-3:#e6f4fe;--blue-4:#d5efff;--blue-6:#acd8fc;--blue-8:#5eb1ef;--blue-9:#0090ff;--blue-11:#0d74ce;
  --teal-1:#fafefd;--teal-2:#f3fbf9;--teal-3:#e0f8f3;--teal-4:#ccf3ea;--teal-5:#b8eae0;--teal-6:#a1ded2;--teal-7:#83cdc1;--teal-8:#53b9ab;--teal-9:#12a594;--teal-10:#0d9b8a;--teal-11:#008573;--teal-12:#0d3d38;
  --background:var(--slate-1);--card:#ffffff;--foreground:var(--slate-12);--muted:var(--slate-3);--muted-foreground:var(--slate-11);
  --border:var(--slate-6);--input:var(--slate-7);--ring:var(--teal-8);--primary:var(--teal-11);--primary-foreground:#ffffff;
  --caution:var(--amber-9);--on-caution:#3a2810;--panel-row:var(--slate-7);
  --shadow:0 1px 2px rgb(16 24 40 / .06),0 1px 3px rgb(16 24 40 / .08);
  --shadow-lg:0 10px 30px -10px rgb(16 24 40 / .25),0 2px 6px rgb(16 24 40 / .08);
  --font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --radius:0.5rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --slate-1:#111113;--slate-2:#18191b;--slate-3:#212225;--slate-4:#272a2d;--slate-5:#2e3135;--slate-6:#363a3f;--slate-7:#43484e;--slate-8:#5a6169;--slate-9:#696e77;--slate-10:#777b84;--slate-11:#b0b4ba;--slate-12:#edeef0;
  --amber-2:#1d180f;--amber-3:#302008;--amber-4:#3f2700;--amber-6:#5c3d05;--amber-7:#714f19;--amber-9:#ffc53d;--amber-10:#ffd60a;--amber-11:#ffca16;--amber-12:#ffe7b3;
  --green-3:#132d21;--green-6:#20573e;--green-9:#30a46c;--green-11:#3dd68c;
  --orange-3:#331e0b;--orange-6:#66350c;--orange-9:#f76b15;--orange-11:#ff801f;
  --red-3:#3b1219;--red-6:#72232d;--red-9:#e5484d;--red-11:#ff9592;
  --blue-3:#0d2847;--blue-4:#003362;--blue-6:#104d87;--blue-8:#2870bd;--blue-9:#0090ff;--blue-11:#70b8ff;--teal-1:#0d1514;--teal-2:#111c1b;--teal-3:#0d2d2a;--teal-4:#023b37;--teal-5:#084843;--teal-6:#145750;--teal-7:#1c6961;--teal-8:#207e73;--teal-9:#12a594;--teal-10:#0eb39e;--teal-11:#0bd8b6;--teal-12:#adf0dd;--primary:var(--teal-9);--primary-foreground:#0d1514;
  --card:var(--slate-2);--shadow:0 1px 2px rgb(0 0 0 / .45),0 1px 3px rgb(0 0 0 / .35);--shadow-lg:0 12px 32px -10px rgb(0 0 0 / .8);color-scheme:dark}}
:root[data-theme="dark"]{
  --slate-1:#111113;--slate-2:#18191b;--slate-3:#212225;--slate-4:#272a2d;--slate-5:#2e3135;--slate-6:#363a3f;--slate-7:#43484e;--slate-8:#5a6169;--slate-9:#696e77;--slate-10:#777b84;--slate-11:#b0b4ba;--slate-12:#edeef0;
  --amber-2:#1d180f;--amber-3:#302008;--amber-4:#3f2700;--amber-6:#5c3d05;--amber-7:#714f19;--amber-9:#ffc53d;--amber-10:#ffd60a;--amber-11:#ffca16;--amber-12:#ffe7b3;
  --green-3:#132d21;--green-6:#20573e;--green-9:#30a46c;--green-11:#3dd68c;
  --orange-3:#331e0b;--orange-6:#66350c;--orange-9:#f76b15;--orange-11:#ff801f;
  --red-3:#3b1219;--red-6:#72232d;--red-9:#e5484d;--red-11:#ff9592;
  --blue-3:#0d2847;--blue-4:#003362;--blue-6:#104d87;--blue-8:#2870bd;--blue-9:#0090ff;--blue-11:#70b8ff;--teal-1:#0d1514;--teal-2:#111c1b;--teal-3:#0d2d2a;--teal-4:#023b37;--teal-5:#084843;--teal-6:#145750;--teal-7:#1c6961;--teal-8:#207e73;--teal-9:#12a594;--teal-10:#0eb39e;--teal-11:#0bd8b6;--teal-12:#adf0dd;--primary:var(--teal-9);--primary-foreground:#0d1514;
  --card:var(--slate-2);--shadow:0 1px 2px rgb(0 0 0 / .45),0 1px 3px rgb(0 0 0 / .35);--shadow-lg:0 12px 32px -10px rgb(0 0 0 / .8);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:var(--teal-5);color:var(--teal-12)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
html{scrollbar-color:var(--slate-7) var(--background)}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:inherit;text-underline-offset:3px}
button{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-size:.8125rem}
.muted{color:var(--muted-foreground)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:14px;height:14px}
td,.tabular{font-variant-numeric:tabular-nums}

/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:calc(var(--radius) - 2px);font:500 .875rem/1 var(--font-sans);border:1px solid transparent;cursor:pointer;transition:background-color .15s,border-color .15s;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:color-mix(in oklab,var(--primary) 86%,var(--background))}
.btn-outline{background:var(--card);border-color:var(--border)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:var(--muted)}
.btn-caution{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btn-caution:hover{background:color-mix(in oklab,var(--primary) 86%,var(--background))}
.btn-danger{background:var(--card);color:var(--red-11);border-color:var(--red-6)}
.btn-danger:hover{background:var(--red-3)}
.btn-sm{height:30px;padding:0 10px;font-size:.8125rem}
.btn-xs{height:26px;padding:0 8px;font-size:.75rem}
.btn-icon{width:36px;padding:0}
.btn-sm.btn-icon{width:30px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{font:600 .9375rem var(--font-sans)}
.card-b{padding:16px}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font:500 .75rem/1 var(--font-sans);border:1px solid var(--border);background:var(--card);white-space:nowrap}
.badge.done{background:var(--green-3);border-color:var(--green-6);color:var(--green-11)}
.badge.risk{background:var(--orange-3);border-color:var(--orange-6);color:var(--orange-11)}
.badge.blocked{background:var(--red-3);border-color:var(--red-6);color:var(--red-11)}
.badge.info{background:var(--blue-3);border-color:var(--blue-6);color:var(--blue-11)}
.badge.pending{background:var(--muted);color:var(--muted-foreground)}
.badge.amber{background:var(--amber-3);border-color:var(--amber-7);color:var(--amber-11)}
.input,.select{height:36px;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--foreground);padding:0 12px;font:400 .875rem var(--font-sans);width:100%}
.select{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--slate-10) 50%),linear-gradient(135deg,var(--slate-10) 50%,transparent 50%);background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.input:focus,.select:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 30%,transparent)}
.input[aria-invalid="true"],.select[aria-invalid="true"]{border-color:var(--red-9)}
.input.sm{height:30px;padding:0 8px;font-size:.8125rem}
.input.num{text-align:right;font-variant-numeric:tabular-nums;width:96px}
.field{display:grid;gap:6px;align-content:start;min-width:0;grid-template-columns:minmax(0,1fr)}
.field label{font:500 .8125rem var(--font-sans)}
.field .err{font-size:.75rem;color:var(--red-11)}
.field .hint{font-size:.75rem;color:var(--muted-foreground)}
.tabs{display:inline-flex;padding:3px;gap:2px;background:var(--muted);border-radius:var(--radius);flex-wrap:wrap}
.tab{height:30px;padding:0 12px;border:0;background:transparent;border-radius:calc(var(--radius) - 2px);font:500 .8125rem var(--font-sans);color:var(--muted-foreground);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.utabs{display:flex;gap:0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.utab{height:42px;padding:0 14px;border:0;background:transparent;font:500 .875rem var(--font-sans);color:var(--muted-foreground);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.utab:hover{color:var(--foreground)}
.utab[aria-selected="true"]{color:var(--teal-11);border-bottom-color:var(--teal-9)}
.utab .count{font:500 .6875rem var(--font-mono);background:var(--muted);border-radius:999px;padding:2px 6px;color:var(--muted-foreground)}
.check{appearance:none;width:16px;height:16px;border:1px solid var(--input);border-radius:4px;background:var(--card);display:inline-grid;place-content:center;cursor:pointer;margin:0;vertical-align:middle}
.check:checked{background:var(--primary);border-color:var(--primary)}
.check:checked::after{content:"";width:8px;height:4px;border:2px solid var(--primary-foreground);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.mark{display:inline-block;width:11px;height:11px;flex:none;vertical-align:-1px}
.mark.done{background:var(--green-9)}
.mark.risk{background:var(--orange-9);clip-path:polygon(50% 0,100% 100%,0 100%)}
.mark.blocked{background:var(--red-9);border-radius:50%}
.mark.pending{border:1.5px solid var(--slate-8)}
.mark.na{height:1.5px;background:var(--slate-7);vertical-align:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.75rem;color:var(--muted-foreground)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tablewrap{position:relative;overflow-x:auto;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.8125rem}
th{font-weight:500;color:var(--muted-foreground);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--slate-2);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--slate-2)}
tr.clickable{cursor:pointer}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
td.wrap{white-space:normal;min-width:220px}
.empty{padding:36px 16px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--muted-foreground)}
.empty h4{font:600 .9375rem var(--font-sans);color:var(--foreground)}
.meter{height:6px;border-radius:999px;background:var(--slate-4);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--teal-9);border-radius:999px;transition:width .4s cubic-bezier(.16,1,.3,1)}
.meter.green i{background:var(--green-9)}
.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:10px 12px;font-size:.8125rem;background:var(--card)}
.alert.warn{background:var(--orange-3);border-color:var(--orange-6);color:var(--orange-11)}
.alert.err{background:var(--red-3);border-color:var(--red-6);color:var(--red-11)}
.alert.info{background:var(--blue-3);border-color:var(--blue-6);color:var(--blue-11)}
.alert.ok{background:var(--green-3);border-color:var(--green-6);color:var(--green-11)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:color-mix(in oklab,var(--background) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font:700 1.0625rem/1 var(--font-sans);letter-spacing:-.02em;text-decoration:none;color:var(--foreground);white-space:nowrap}
.brand i{width:14px;height:14px;background:var(--teal-9);border:1px solid var(--teal-10);border-radius:3px}
.brand small{font:500 .75rem var(--font-sans);color:var(--muted-foreground);letter-spacing:0;padding-left:10px;border-left:1px solid var(--border)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--muted-foreground);min-width:0;overflow:hidden;white-space:nowrap}
.crumbs button{background:none;border:0;padding:2px 4px;border-radius:4px;cursor:pointer;color:inherit}
.crumbs button:hover{color:var(--foreground);background:var(--muted)}
.crumbs b{color:var(--foreground);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{color:var(--slate-8)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.demo-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 10px;border-radius:999px;border:1px dashed var(--amber-7);background:var(--amber-2);font:500 .75rem var(--font-sans);color:var(--amber-11)}
.demo-chip button{height:22px;border-radius:999px;border:1px solid var(--amber-7);background:var(--card);padding:0 8px;cursor:pointer;font:500 .75rem var(--font-sans);color:var(--foreground)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--slate-4);display:grid;place-items:center;font:600 .75rem var(--font-sans);border:1px solid var(--border)}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:340px;max-width:calc(100vw - 32px);z-index:40;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px}
.pop .pi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px;border-radius:6px;cursor:pointer;text-align:left;background:none;border:0;width:100%}
.pop .pi:hover{background:var(--muted)}
.pop .pi b{font-size:.8125rem;display:block}
.pop .pi span{font-size:.75rem;color:var(--muted-foreground)}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red-9);border:2px solid var(--background)}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 56px)}
.side{border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px;background:var(--slate-2)}
.side .proj{padding:8px 10px 14px;display:grid;gap:4px;border-bottom:1px solid var(--border);margin-bottom:8px}
.side .proj b{font-size:.875rem}
.side .proj span{font-size:.75rem;color:var(--muted-foreground)}
.nav-i{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;border:0;background:none;cursor:pointer;font:500 .8125rem var(--font-sans);color:var(--muted-foreground);text-align:left;width:100%}
.nav-i:hover{background:var(--muted);color:var(--foreground)}
.nav-i[aria-current="page"]{background:var(--teal-3);color:var(--teal-11);box-shadow:inset 0 0 0 1px var(--teal-6)}
.nav-i .count{margin-left:auto;font:500 .6875rem var(--font-mono)}
.stack{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.main{padding:24px clamp(16px,2.5vw,32px) 64px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-content:start}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.ph h1{font:650 1.625rem/1.15 var(--font-sans);font-weight:650;letter-spacing:-.025em}
.ph p{color:var(--muted-foreground);margin-top:4px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toolbar .l,.toolbar .rr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{position:relative;width:280px;max-width:100%}
.search .icon{position:absolute;left:10px;top:10px;color:var(--muted-foreground)}
.search .input{padding-left:32px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.facts div{padding:12px 16px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:grid;gap:2px;min-width:0}
.facts div:nth-child(4n){border-right:0}
.facts dt{font-size:.75rem;color:var(--muted-foreground)}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{padding:16px;display:grid;gap:12px;cursor:pointer;text-align:left;font:inherit;transition:border-color .15s}
.pcard:hover{border-color:var(--slate-8)}
.pcard .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:.75rem;color:var(--muted-foreground)}
.pcard .kv b{display:block;color:var(--foreground);font:500 .8125rem var(--font-mono)}
.timeline{display:grid;gap:8px}
.tl-bar{position:relative;height:10px;border-radius:999px;background:var(--slate-4)}
.tl-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--green-9)}
.tl-bar b{position:absolute;top:-5px;width:2px;height:20px;background:var(--foreground)}
.tl-l{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted-foreground)}
.statgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);overflow:hidden}
.statgrid div{padding:10px 12px;border-right:1px solid var(--border);display:grid;gap:4px}
.statgrid div:last-child{border-right:0}
.statgrid span{font-size:.75rem;color:var(--muted-foreground);display:flex;gap:6px;align-items:center}
.statgrid b{font:600 1.125rem var(--font-mono)}

/* SO header */
.sohead{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border-top:1px solid var(--border)}
.sohead div{padding:10px 16px;border-right:1px solid var(--border);display:grid;gap:2px;min-width:0}
.sohead div:last-child{border-right:0}
.sohead dt{font-size:.75rem;color:var(--muted-foreground)}
.sohead dd{margin:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* allocation map */
.alloc{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px}
.map{position:relative;background:var(--slate-2);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:16px 16px 54px;touch-action:none;user-select:none;-webkit-user-select:none;min-width:0}
.plant{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:minmax(46px,auto);gap:8px}
.pb{position:relative;border:1px solid var(--slate-7);border-radius:3px;background:repeating-linear-gradient(90deg,var(--panel-row) 0 2px,transparent 2px 6px),var(--card);cursor:crosshair;padding:0;min-height:46px}
.pb .lbl{position:absolute;left:4px;top:4px;font:600 .6875rem/1 var(--font-mono);background:var(--card);padding:2px 4px;border-radius:3px;border:1px solid var(--border)}
.pb .qty{position:absolute;right:4px;bottom:4px;font:500 .625rem/1 var(--font-mono);background:var(--card);padding:2px 4px;border-radius:3px;color:var(--muted-foreground)}
.pb.taken{background:repeating-linear-gradient(90deg,var(--amber-7) 0 2px,transparent 2px 6px),var(--amber-3);border-color:var(--amber-7)}
.pb[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue-9);background:repeating-linear-gradient(90deg,var(--blue-6) 0 2px,transparent 2px 6px),var(--blue-3)}
.lasso{position:absolute;border:1.5px dashed var(--teal-9);background:color-mix(in oklab,var(--teal-9) 12%,transparent);pointer-events:none}
.maptools{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sw{width:14px;height:10px;border-radius:2px;border:1px solid var(--slate-7);display:inline-block}
.sw.sel{background:var(--blue-3);border-color:var(--blue-9)}
.sw.mine{background:var(--amber-3);border-color:var(--amber-7)}
.acts{display:grid;gap:8px;align-content:start;min-width:0}
.act{border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:10px 12px;display:grid;gap:8px;cursor:pointer;background:var(--card);text-align:left;width:100%}
.act[aria-checked="true"]{border-color:var(--teal-9);box-shadow:0 0 0 1px var(--teal-9);background:var(--teal-2)}
.act .t{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:.8125rem}
.act .q{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:.75rem;color:var(--muted-foreground)}
.act .q b{display:block;color:var(--foreground);font:500 .8125rem var(--font-mono)}

.pb.off{opacity:.35;cursor:not-allowed;background:var(--slate-3)}
.cfghead{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end}
.kv2{display:grid;gap:4px;font-size:.8125rem;max-width:280px}
.kv2 span{color:var(--muted-foreground)}
.kv2 b{font-weight:500;font-size:.875rem}
.cfgacts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.locrow{display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr) auto;gap:16px;align-items:start;padding-bottom:12px;border-bottom:1px dashed var(--border)}
.locrow:last-child{border-bottom:0;padding-bottom:0}
.blkpick{display:flex;flex-wrap:wrap;gap:6px}
.bchip{height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);font:500 .75rem var(--font-mono);cursor:pointer}
.bchip[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.bchip[disabled]{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.actbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:14px 16px;background:var(--slate-2);border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0}
.descbox{min-width:0;max-width:100%;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);background:var(--card);padding:8px 12px;font-size:.875rem;display:flex;gap:8px;align-items:flex-start;min-height:36px}
.descbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.linkbtn{background:none;border:0;padding:0;color:var(--teal-11);font:500 .8125rem var(--font-sans);cursor:pointer;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.schip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 10px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:.75rem}
.schip small{font:500 .625rem var(--font-mono);color:var(--muted-foreground)}
.schip button{width:20px;height:20px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted-foreground)}
.schip button:hover{background:var(--muted);color:var(--foreground)}
.viewgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px;padding:14px 16px}
.actgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;padding:14px 16px}
.totbox{height:30px;display:flex;align-items:center;padding:0 10px;border-radius:calc(var(--radius) - 2px);background:var(--muted);font:500 .8125rem var(--font-mono);font-variant-numeric:tabular-nums}
.actfoot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;padding:0 16px 14px}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:var(--radius);background:var(--slate-12);color:var(--slate-1);box-shadow:var(--shadow-lg);font-size:.8125rem}

@media (max-width:1100px){.viewgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.actbar{grid-template-columns:minmax(0,1fr)}.actgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.viewgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.locrow{grid-template-columns:minmax(0,1fr) auto}.locrow>.field:nth-child(2){grid-column:1/-1;grid-row:2}.actgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cfgacts{margin-left:0}}
/* config */
.cfg{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.alist{display:grid;gap:6px}
.aitem{border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:10px 12px;text-align:left;background:var(--card);cursor:pointer;display:grid;gap:4px}

.aitem span{font-size:.75rem;color:var(--muted-foreground)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr)}
.login .art{position:relative;overflow:hidden;background:var(--slate-12);color:var(--slate-1);padding:40px;display:flex;flex-direction:column;justify-content:space-between}
:root[data-theme="dark"] .login .art{background:var(--slate-3);color:var(--slate-12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .login .art{background:var(--slate-3);color:var(--slate-12)}}
.rows{position:absolute;inset:auto -10% -20% -10%;height:70%;transform:perspective(600px) rotateX(55deg);transform-origin:bottom;
  background:repeating-linear-gradient(90deg,color-mix(in oklab,var(--teal-9) 60%,transparent) 0 26px,transparent 26px 34px),repeating-linear-gradient(0deg,transparent 0 46px,color-mix(in oklab,var(--slate-1) 18%,transparent) 46px 48px);opacity:.55;-webkit-mask:linear-gradient(to top,#000 30%,transparent);mask:linear-gradient(to top,#000 30%,transparent)}
.login .art h2{font:650 clamp(1.75rem,3vw,2.5rem)/1.1 var(--font-sans);letter-spacing:-.03em;max-width:16ch;position:relative}
.login .art p{max-width:42ch;opacity:.8;margin-top:12px;position:relative}
.login .form{display:grid;place-items:center;padding:32px 20px}
.login .box{width:100%;max-width:380px;display:grid;gap:16px}

/* toast */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;animation:tin .35s cubic-bezier(.16,1,.3,1)}

.toast span{font-size:.75rem;color:var(--muted-foreground)}
@keyframes tin{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.confirm{display:flex;gap:6px;align-items:center}

function buildIdx(st){
  const iss={},pend={},retPend={};
  st.res.forEach(r=>{ if(r.status==='Withdrawn'||r.status==='Rejected') return;
    if(r.type==='MIRS') r.lines.forEach(l=>{ if(!l.split) return; const f=l.qty?l.posted/l.qty:0; Object.keys(l.split).forEach(t=>{const k=r.so+'|'+r.act+'|'+t+'|'+l.mat; iss[k]=(iss[k]||0)+l.split[t]*f; if(r.status!=='Closed') pend[k]=(pend[k]||0)+l.split[t]*(1-f);});});
    else if(r.status!=='Closed'){ retPend[r.so+'|'+r.act]=true; } });
  return {iss,pend,retPend};
}
function tStatus(st,ix,o,a,t,scope){
  if(!scope.has(t)) return 'scope';
  if(!get(st.alloc,o.so,a.code).includes(t)){ return st.sos.some(s=>s.so!==o.so&&s.pid===o.pid&&get(st.alloc,s.so,a.code).includes(t))?'others':'none'; }
  if(get(st.done,o.so,a.code).includes(t)) return 'used';
  if(!a.boq.length) return 'notreq';
  let full=true,any=false,pd=false;
  a.boq.forEach(b=>{const k=o.so+'|'+a.code+'|'+t+'|'+b.mat; const need=tq(a,t)*b.per; const i=ix.iss[k]||0; if(i<need*0.999) full=false; if(i>1e-9) any=true; if((ix.pend[k]||0)>1e-9) pd=true;});
  if(any&&ix.retPend[o.so+'|'+a.code]) return 'return';
  if(full) return 'issued'; if(any) return 'mixed'; if(pd) return 'requested'; return 'notreq';
}

    case 'boqImport': { s.boqs.filter(x=>x.pid===a.from).forEach(b=>{const v=b.versions.find(x=>x.ver===b.cur); s.boqs.push({id:'b'+Date.now()+b.id,pid:a.to,name:b.name.replace('HLX',(s.projects.find(p=>p.id===a.to).name.split('-')[0]).slice(0,3).toUpperCase())+' (Pre-Bid)',pkg:b.pkg,cur:1,versions:[{ver:1,lines:v.lines.filter(l=>!INACTIVE.has(l.mat)).map(l=>({...l,wbs:''})),date:new Date(DEMO_TODAY),by:s.user.name,cmt:'Imported from '+s.projects.find(p=>p.id===a.from).name}]});}); return s; }
    case 'prCreate': { s.prs.unshift({no:'PR-'+(31000413+s.prs.length),pid:a.pid,boq:a.boq,type:a.type,date:new Date(DEMO_TODAY),lines:a.lines}); return s; }
    default: return st;
  }
}

const Ctx=createContext(null);
const useApp=()=>useContext(Ctx);
function useHashRoute(){
  const get=()=> (location.hash||'').replace(/^#/,'');
  const [hh,setH]=useState(get());
  useEffect(()=>{const f=()=>setH(get()); window.addEventListener('hashchange',f); return ()=>window.removeEventListener('hashchange',f)},[]);
  const go=useCallback((to)=>{ if(get()===to) setH(to); else location.hash=to; window.scrollTo(0,0); },[]);
  return [hh,go];
}
function parse(hh,st){
  if(!hh) return {v:'projects'};
  const al={allocation:'so.7100004821.map.120010411.alloc',completion:'so.7100004821.map.120010411.done',requisition:'so.7100004821.map.120010411.mirs',work:'so.7100004821.work',status:'p.helios.status',orders:'p.helios.orders',mirs:'so.7100004821.mirs',mrrs:'so.7100004821.mrrs',reservation:'so.7100004821.res',config:'so.7100004821.config',movement:'so.7100004821.moves',boq:'p.helios.eng.gen',dashboard:'p.helios.dash',dash:'p.helios.dash',wmc:'p.helios.wmc',eng:'p.helios.eng',recon:'p.helios.recon',roles:'roles'};
  if(al[hh]) hh=al[hh];
  const p=hh.split('.');
  if(p[0]==='login') return {v:'login'};
  if(p[0]==='projects') return {v:'projects'};
  if(p[0]==='project'&&p[1]==='new') return {v:'pform'};
  if(p[0]==='project'&&p[2]==='edit') return {v:'pform',id:p[1]};
  if(p[0]==='roles') return {v:'roles'};
  if(p[0]==='p') return {v:'project',id:p[1],sec:p[2]||'overview',tab:p[3]};
  if(p[0]==='so'){ const o=soById(st,p[1]); if(!o) return {v:'projects'}; if(p[2]==='map') return {v:'map',so:p[1],act:p[3],mode:p[4]||'alloc'}; return {v:'so',so:p[1],id:o.pid,tab:p[2]||'config'}; }
  return {v:'projects'};
}

function ThemeBtn(){
  const root=document.documentElement;
  const isDark=()=>{const t=root.getAttribute('data-theme'); return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
  const [d,setD]=useState(isDark());
  useEffect(()=>{try{const s=localStorage.getItem('verse-theme'); if(s){root.setAttribute('data-theme',s); setD(s==='dark');}}catch(e){}
    const mq=matchMedia('(prefers-color-scheme: dark)'); const f=()=>setD(isDark()); mq.addEventListener&&mq.addEventListener('change',f); return ()=>mq.removeEventListener&&mq.removeEventListener('change',f)},[]);
  const flip=()=>{const n=isDark()?'light':'dark'; root.setAttribute('data-theme',n); try{localStorage.setItem('verse-theme',n)}catch(e){} setD(n==='dark')};
  return html`<button class="btn btn-ghost btn-icon btn-sm" type="button" onClick=${flip} aria-label=${'Switch to '+(d?'light':'dark')+' theme'}>${I(d?'sun':'moon')}</button>`;
}
function Bell(){
  const {st,go}=useApp(); const [open,setOpen]=useState(false); const ref=useRef();
  useEffect(()=>{const f=e=>{if(ref.current&&!ref.current.contains(e.target)) setOpen(false)}; document.addEventListener('pointerdown',f); return ()=>document.removeEventListener('pointerdown',f)},[]);
  const f=fnOf(st.role), all=st.role==='Super Admin'; const items=[];
  if(all||f==='PMAG') st.projects.filter(p=>!p.linked).slice(0,2).forEach(p=>items.push({m:'pending',t:'Link with SAP · '+p.name,d:'Project is in Pre-Bid. Link it once SAP codes are available.',to:'p.'+p.id+'.overview'}));
  if(all||f==='Engineering'){ st.projects.filter(p=>!st.boqs.some(b=>b.pid===p.id)).slice(0,2).forEach(p=>items.push({m:'pending',t:'Project created · '+p.name,d:'Import or upload a BoQ to start Pre-Bid estimating.',to:'p.'+p.id+'.eng.boq'})); items.push({m:'done',t:'BoQ generated · HLX Civil BoQ v2',d:'Ready for PR creation.',to:'p.helios.eng.pr'}); }
  if(all||f==='Projects'){ st.sos.filter(s=>s.sync==='failed').forEach(s=>items.push({m:'blocked',t:'SAP sync failed · SO '+s.so,d:s.contractor+'. Retry from Service orders.',to:'p.'+s.pid+'.orders'}));
    if(can(st,'approve')){ const pa=st.res.filter(r=>r.status==='Pending approval'); if(pa.length) items.push({m:'risk',t:pa.length+' requisition'+(pa.length>1?'s':'')+' need your approval',d:'Quantity above the remaining requirement.',to:'so.'+pa[0].so+'.res'}); const rv=Object.values(st.meas).filter(v=>v==='review').length; if(rv) items.push({m:'risk',t:rv+' tables awaiting measurement approval',d:'Approve or reject in WMC.',to:'p.helios.wmc'}); }
    st.docs.slice(0,2).forEach(d=>{const r=st.res.find(x=>x.id===d.res); if(r) items.push({m:'done',t:(r.type==='MIRS'?'Material issued':'Return received')+' · '+r.id,d:d.lines.length+' lines posted in SAP on '+dstr(d.date)+'.',to:'so.'+r.so+'.res'});});
    st.res.filter(r=>r.status==='Rejected').slice(0,1).forEach(r=>items.push({m:'blocked',t:'Requisition rejected · '+r.slip,d:r.rejectNote||'Rejected by stores.',to:'so.'+r.so+'.res'}));
    items.push({m:'blocked',t:'B-07 · Gate order violated',d:'RFI closed before material issue was recorded.',to:'p.helios.status'}); }
  if(all||f==='Store'){ const op=st.res.filter(r=>r.status==='Open'||r.status==='Partially posted'); if(op.length) items.push({m:'risk',t:op.length+' requisitions waiting for stores',d:'Issue or receive in Reservations & Posting.',to:'so.'+op[0].so+'.res'}); }
  return html`<div style="position:relative" ref=${ref}>
    <button class="btn btn-ghost btn-icon btn-sm" type="button" aria-label=${'Notifications, '+items.length} aria-expanded=${open} onClick=${()=>setOpen(!open)} style="position:relative">${I('bell')}${items.length?html`<span class="dot"></span>`:null}</button>
    ${open&&html`<div class="pop" role="menu"><div class="muted" style="font-size:.6875rem;padding:6px 10px">For ${st.role}</div>${items.length?items.map(it=>html`<button class="pi" role="menuitem" type="button" onClick=${()=>{setOpen(false);go(it.to)}}><i class=${'mark '+it.m} style="margin-top:4px"></i><div><b>${it.t}</b><span>${it.d}</span></div></button>`):html`<div class="muted" style="padding:10px;font-size:.8125rem">Nothing new for this role.</div>`}</div>`}
  </div>`;
}

function Orders({pid}){
  const {st,dispatch,go,toast}=useApp(); const [q,setQ]=useState(''); const [pk,setPk]=useState('All');
  const sos=st.sos.filter(s=>s.pid===pid&&(pk==='All'||s.pkg===pk)&&(s.so+s.contractor).toLowerCase().includes(q.toLowerCase()));
  const timers=useRef({});
  const sync=(s)=>{dispatch({t:'sync',so:s.so,state:'syncing'}); clearTimeout(timers.current[s.so]); timers.current[s.so]=setTimeout(()=>{dispatch({t:'sync',so:s.so,state:'ok'}); toast('ok','SO '+s.so+' synced','Service order is up to date with SAP.')},1400)};
  useEffect(()=>{ st.sos.filter(s=>s.sync==='syncing').forEach(s=>{timers.current[s.so]=setTimeout(()=>dispatch({t:'sync',so:s.so,state:'ok'}),2500)}); return ()=>Object.values(timers.current).forEach(clearTimeout)},[]);
  const ago=m=>m<1?'Just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago';
  const pr=st.projects.find(x=>x.id===pid); if(!pr.linked) return html`<${ProjectLayout} pid=${pid} sec="orders" crumbs=${[{l:'Service orders'}]}><div class="ph"><div><h1>Service orders</h1></div></div><div class="card"><div class="empty"><h4>Service orders are read from SAP</h4><p>${pr.name} is not linked with SAP yet. Link it from the overview to start reading service orders.</p><button class="btn btn-outline btn-sm" type="button" onClick=${()=>go('p.'+pid+'.overview')}>Go to Link with SAP</button></div></div><//>`;
  return html`<${ProjectLayout} pid=${pid} sec="orders" crumbs=${[{l:'Service orders'}]}>
    <div class="ph"><div><h1>Service orders</h1><p>Read-only from SAP. Open an order to configure, allocate and manage material.</p></div>
      <div class="acts"><button class="btn btn-outline btn-sm" type="button" onClick=${()=>sos.forEach(s=>s.sync!=='syncing'&&sync(s))} disabled=${!sos.length}>${I('refresh','sm')}Sync all</button></div></div>
    <div class="toolbar"><div class="l"><div class="search">${I('search','sm')}<input class="input" placeholder="Search order or contractor" value=${q} onInput=${e=>setQ(e.target.value)} aria-label="Search service orders"/></div>
      <div class="tabs" role="tablist" aria-label="Package">${['All','Civil','Mechanical','Electrical'].map(x=>html`<button class="tab" role="tab" type="button" aria-selected=${pk===x} onClick=${()=>setPk(x)}>${x}</button>`)}</div></div></div>
    ${!sos.length?html`<div class="card"><div class="empty"><h4>No service orders</h4><p>${q||pk!=='All'?'Nothing matches these filters.':'Orders released in SAP for this project appear here after the next sync.'}</p></div></div>`:
    html`<div class="tablewrap"><table><thead><tr><th>Service order</th><th>Release</th><th>Contractor</th><th>Vendor code</th><th>Package</th><th>Plant</th><th class="r">Lines</th><th>Status</th><th>Last synced</th><th><span class="sr-only">Sync</span></th></tr></thead>
      <tbody>${sos.map(s=>html`<tr class="clickable" key=${s.so} onClick=${()=>go('so.'+s.so+'.config')}>
        <td class="mono"><b style="font-weight:500">${s.so}</b></td><td>${dstr(s.release)}</td><td>${s.contractor}</td><td class="mono">${s.vendor}</td><td>${s.pkg}</td><td class="mono">${s.plant}</td><td class="r">${s.acts.length}</td>
        <td><span class=${'badge '+(s.status==='WIP'?'info':s.status==='Completed'?'done':'pending')}>${s.status}</span></td>
        <td>${s.sync==='syncing'?html`<span style="color:var(--blue-11);display:inline-flex;gap:6px;align-items:center"><svg class="icon sm spin" aria-hidden="true"><use href="#i-refresh"/></svg>Syncing…</span>`:s.sync==='failed'?html`<span style="color:var(--red-11)">Failed · SAP timeout</span>`:ago(s.syncedMin)}</td>
        <td class="r" onClick=${e=>e.stopPropagation()}>${s.sync==='failed'?html`<button class="btn btn-danger btn-xs" type="button" onClick=${()=>sync(s)}>Retry</button>`:html`<button class="btn btn-ghost btn-xs btn-icon" type="button" disabled=${s.sync==='syncing'} aria-label=${'Sync '+s.so} onClick=${()=>sync(s)}>${I('refresh','sm')}</button>`}</td></tr>`)}</tbody></table></div>`}
  <//>`;
}

const SOTABS=[['config','S.O. Config'],['work','Work Management'],['mirs','MIRS'],['mrrs','MRRS'],['res','Reservations & Posting'],['moves','Material Movement']];
function SOHead({o,extra}){
  return html`<div class="card"><div class="card-b cfghead">
    <div class="kv2"><span>Service order no.</span><b class="mono">${o.so}</b></div>
    <div class="kv2" style="min-width:0;max-width:360px"><span>Vendor detail</span><b title=${o.vendor+' - '+o.contractor} style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.vendor} - ${o.contractor}</b></div>
    <div class="kv2"><span>Package</span><b>${o.pkg}</b></div>${extra||null}</div></div>`;
}
function SODetail({so,tab}){
  const {st,go}=useApp(); const o=soById(st,so); const pid=o.pid;
  const openRes=st.res.filter(r=>r.so===so&&(r.status==='Open'||r.status==='Partially posted')).length;
  return html`<${ProjectLayout} pid=${pid} sec="orders" crumbs=${[{l:'Service orders',to:'p.'+pid+'.orders'},{l:so}]}>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1 style="font:650 1.25rem var(--font-sans);letter-spacing:-.02em">SO ${so}</h1><span class=${'badge '+(o.status==='WIP'?'info':o.status==='Closed'?'done':'pending')}>${o.status}</span>${o.sync==='failed'?html`<span class="badge blocked"><i class="mark blocked"></i>Sync failed</span>`:null}<span class="muted" style="font-size:.75rem;margin-left:auto">${o.contractor} · Synced from SAP</span></div>
    <div class="utabs" role="tablist" aria-label="Service order sections">${SOTABS.map(([k,l])=>html`<button class="utab" role="tab" type="button" aria-selected=${tab===k} onClick=${()=>go('so.'+so+'.'+k)}>${l}${k==='res'&&openRes?html`<span class="count">${openRes}</span>`:null}</button>`)}</div>
    ${tab==='config'?html`<${SOConfig} o=${o}/>`:tab==='work'?html`<${WorkList} o=${o}/>`:tab==='mirs'?html`<${MirsList} o=${o}/>`:tab==='mrrs'?html`<${Mrrs} o=${o}/>`:tab==='res'?html`<${Reservations} o=${o}/>`:html`<${Moves} o=${o}/>`}
  <//>`;
}

const UOML={Nos:'NUMBER',EACH:'EACH',MT:'METRIC TON',km:'KILOMETER',cum:'CUBIC METRE',Set:'SET'};
const UOMS={Nos:'no',EACH:'ea',MT:'t',km:'km',cum:'m³',Set:'set'};
function StatusSelect({o}){
  const {dispatch,toast}=useApp();
  if(o.status==='Completed') return html`<div class="kv2"><span>Status</span><b><span class="badge done">Completed</span></b></div>`;
  return html`<div class="field" style="width:130px"><label for="sost">Status<span style="color:var(--red-11)"> *</span></label><select class="select" style="height:30px;font-size:.8125rem" id="sost" value=${o.status} onChange=${e=>{dispatch({t:'soStatus',so:o.so,v:e.target.value}); toast('ok','Status changed','SO '+o.so+' is now '+e.target.value+'.')}}>${['Open','WIP','Closed'].map(x=>html`<option>${x}</option>`)}</select></div>`;
}
function SOConfigView({o,onEdit}){
  const {st}=useApp(); const [q,setQ]=useState(''); const [more,setMore]=useState({});
  const acts=o.acts.filter(a=>(a.code+a.name+(a.desc||'')).toLowerCase().includes(q.toLowerCase()));
  return html`<div class="stack">
    <div class="card"><div class="card-b cfghead">
      <div class="kv2"><span>Service order</span><b class="mono">${o.so}</b></div>
      <div class="kv2" style="min-width:0"><span>Vendor</span><b title=${o.vendor+' - '+o.contractor} style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.vendor} - ${o.contractor}</b></div>
      <div class="kv2"><span>Amend no.</span><b>${o.amendNo||'—'}</b></div>
      <div class="kv2"><span>Amend date</span><b>${o.amendDate?dstr(new Date(o.amendDate)):'—'}</b></div>
      <div class="kv2"><span>Package</span><b>${o.pkg}</b></div>
      <${StatusSelect} o=${o}/>
      <div class="kv2" style="min-width:0;max-width:420px;flex:1 1 260px"><span>Subject</span><b title=${o.subject} style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.subject}</b></div>
      <div class="cfgacts">${o.status==='Completed'?null:html`<${Gate} k="configEdit"><button class="btn btn-primary btn-sm" type="button" onClick=${onEdit}>${I('edit','sm')}Edit</button><//>`}</div>
    </div></div>
    <div class="card"><div class="card-h"><h3>Work location and work area mapping</h3><span class="muted" style="font-size:.75rem">${(o.locs||[]).reduce((t,l)=>t+l.blocks.length,0)} blocks</span></div>
      ${(o.locs||[]).length?html`<div class="tablewrap" style="border:0;border-radius:0"><table><thead><tr><th style="width:220px">Work location (plot)</th><th>Work area (blocks)</th></tr></thead><tbody>${o.locs.map(l=>html`<tr><td class="mono">${l.plot}</td><td class="wrap"><div class="chips" style="margin:0">${l.blocks.map(b=>html`<span class="badge pending mono">${b}</span>`)}</div></td></tr>`)}</tbody></table></div>`:
      html`<div class="empty"><h4>No work locations mapped</h4><p>Edit the configuration to map plots and blocks before allocating work.</p><button class="btn btn-outline btn-sm" type="button" onClick=${onEdit}>Map work locations</button></div>`}</div>
    <div class="toolbar"><div class="l"><h3 style="font:600 .9375rem var(--font-sans)">S.O. activities</h3><span class="muted" style="font-size:.8125rem">${o.acts.length} lines</span></div>
      <div class="rr"><div class="search">${I('search','sm')}<input class="input" placeholder="Search activity or service code" value=${q} onInput=${e=>setQ(e.target.value)} aria-label="Search activities"/></div></div></div>
    ${!acts.length?html`<div class="card"><div class="empty"><h4>No activities match</h4><p>Clear the search to see all lines.</p></div></div>`:null}
    ${acts.map((a,i)=>{const d=a.desc||a.name; const long=d.length>240; return html`<div class="card" key=${a.code+i}>
      <div class="actbar" style="padding:12px 16px"><div class="kv2" style="max-width:none"><span style="color:var(--teal-11);font-weight:500">S.O. activity</span><b>${a.name}</b></div>
        <div class="kv2" style="max-width:none"><span style="color:var(--teal-11);font-weight:500">Site activity</span><b>${a.site.length?a.site.map(s=>s.name).join(', '):html`<span class="badge risk"><i class="mark risk"></i>Not configured</span>`}</b></div></div>
      <div class="viewgrid">
        <div class="kv2"><span>Service code</span><b class="mono">${a.code}</b></div>
        <div class="kv2"><span>UoM</span><b>${UOML[a.uom]||a.uom}</b></div>
        <div class="kv2"><span>Quantity</span><b class="mono">${fmt(a.soQty)}</b></div>
        <div class="kv2"><span>Unit rate</span><b class="mono">${Number(a.rate).toFixed(2)}/1 ${UOMS[a.uom]||a.uom}</b></div>
        <div class="kv2"><span>Total amount</span><b class="mono">₹ ${fmt(Math.round(a.soQty*a.rate),0)}</b></div>
        <div class="kv2"><span>Site UoM</span><b>${[...new Set(a.site.map(s=>s.uom))].join(', ')||'—'}</b></div>
        <div class="kv2"><span>Mapped to blocks</span><b class="mono">${fmt(mappedQty(st,o.so,a.code))} ${a.uom}</b></div>
      </div>
      <div style="padding:0 16px 14px;display:grid;gap:6px;max-width:820px"><span style="color:var(--teal-11);font:500 .8125rem var(--font-sans)">Line item description</span>
        <p style="font-size:.8125rem;line-height:1.6;color:var(--muted-foreground)">${long&&!more[i]?d.slice(0,240)+'…':d} ${long?html`<button class="linkbtn" type="button" onClick=${()=>setMore({...more,[i]:!more[i]})}>${more[i]?'Show less':'Read more'}</button>`:null}</p>
        ${a.remarks?html`<span style="color:var(--teal-11);font:500 .8125rem var(--font-sans);margin-top:6px">Remarks</span><p style="font-size:.8125rem;color:var(--muted-foreground)">${a.remarks}</p>`:null}</div>
    </div>`})}
  </div>`;
}

function SOConfig({o}){
  const {st,dispatch,toast}=useApp();
  const snap=()=>JSON.parse(JSON.stringify({subject:o.subject||'',pkg:o.pkg,amendNo:o.amendNo||'',amendDate:o.amendDate||'',locs:o.locs||[],acts:o.acts}));
  const [d,setD]=useState(snap); const [errs,setErrs]=useState({}); const [q,setQ]=useState(''); const [more,setMore]=useState({}); const [boqOpen,setBoqOpen]=useState({}); const [pick,setPick]=useState({}); const [askCancel,setAskCancel]=useState(false); const [mode,setMode]=useState('view');
  useEffect(()=>{setD(snap());setErrs({});setMode('view')},[o.so]);
  if(mode==='view') return html`<${SOConfigView} o=${o} onEdit=${()=>{setD(snap());setErrs({});setAskCancel(false);setMode('edit')}}/>`;
  const dirty=JSON.stringify(d)!==JSON.stringify(snap());
  const up=fn=>setD(prev=>{const n=JSON.parse(JSON.stringify(prev)); fn(n); return n;});
  const usedBlocks=b=>d.locs.some(l=>l.blocks.includes(b));
  const validate=()=>{const e={};
    d.locs.forEach((l,i)=>{ if(!l.plot.trim()) e['plot'+i]='Enter the plot.'; else if(d.locs.some((m,j)=>j!==i&&m.plot.trim().toLowerCase()===l.plot.trim().toLowerCase())) e['plot'+i]='This plot is already mapped.'; if(!l.blocks.length) e['blk'+i]='Pick at least one block.'; });
    if(!d.locs.length) e.locs='Map at least one work location so blocks can be allocated.';
    { const mapped=new Set(d.locs.flatMap(l=>l.blocks)); const stuck=[...new Set(Object.values(st.alloc[o.so]||{}).flat().map(t=>TBL[t]?TBL[t].block:t))].filter(b=>!mapped.has(b)).sort(); if(stuck.length) e.locs=stuck.join(', ')+' already '+(stuck.length>1?'have':'has')+' work allocated on this order. Release it in Work Management before removing it from the work area.'; }
    d.acts.forEach((a,i)=>{ if(!/^\d{9}$/.test(a.code)) e['code'+i]='9-digit service code.'; else if(d.acts.some((b,j)=>j!==i&&b.code===a.code)) e['code'+i]='Duplicate code.';
      if(!a.name.trim()) e['name'+i]='Enter the activity description.'; if(!a.uom) e['uom'+i]='Pick a unit.';
      if(!(Number(a.soQty)>0)) e['qty'+i]='Above 0.'; else { const m=mappedQty(st,o.so,a.code); if(m>Number(a.soQty)) e['qty'+i]='Below mapped '+fmt(m)+'.'; }
      if(!(Number(a.rate)>=0)||a.rate==='') e['rate'+i]='0 or more.'; if(!a.site.length) e['site'+i]='Add at least one site activity.'; });
    return e;};
  const save=()=>{const e=validate(); setErrs(e); if(Object.keys(e).length){toast('err','Fix '+Object.keys(e).length+' field'+(Object.keys(e).length>1?'s':'')+' before saving','Problems are marked in red.'); const k=Object.keys(e)[0]; const el=document.querySelector('[data-err="'+k+'"]'); el&&el.scrollIntoView({block:'center'}); return;}
    dispatch({t:'soSave',so:o.so,d:{...d,acts:d.acts.map(a=>({...a,soQty:Number(a.soQty),rate:Number(a.rate)}))}}); toast('ok','S.O. configuration saved',d.acts.length+' activities · '+d.locs.length+' work locations'); setMode('view');};
  const addAct=()=>{up(n=>{n.acts.push({code:'',name:'',desc:'',uom:'Nos',soQty:'',rate:'',perW:0,site:[],boq:[],remarks:'',manual:true});}); setTimeout(()=>{const els=document.querySelectorAll('.soact'); els.length&&els[els.length-1].scrollIntoView({block:'center'})},50);};
  const opts=SITE_OPTIONS[d.pkg]||[];
  const shown=d.acts.map((a,i)=>({a,i})).filter(({a})=>(a.code+a.name+a.desc).toLowerCase().includes(q.toLowerCase()));
  const E=k=>errs[k]?html`<span class="err" data-err=${k}>${errs[k]}</span>`:null;
  const total=d.acts.reduce((t,a)=>t+(Number(a.soQty)||0)*(Number(a.rate)||0),0);
  return html`<div class="stack">
    <div class="card">
      <div class="card-b cfghead">
        <div class="kv2"><span>Service order no.</span><b class="mono">${o.so}</b></div>
        <div class="kv2" style="min-width:0"><span>Vendor</span><b title=${o.vendor+' - '+o.contractor} style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.vendor} - ${o.contractor}</b></div>
        <div class="field" style="width:120px"><label for="amn">Amend no.</label><input class="input sm" id="amn" placeholder="—" value=${d.amendNo} onInput=${e=>up(n=>{n.amendNo=e.target.value})}/></div>
        <div class="field" style="width:150px"><label for="amd">Amend date</label><input class="input sm" id="amd" type="date" value=${d.amendDate} onInput=${e=>up(n=>{n.amendDate=e.target.value})}/></div>
        <div class="field" style="width:160px"><label for="pkg">Package</label><select class="select" style="height:30px;font-size:.8125rem" id="pkg" value=${d.pkg} onChange=${e=>up(n=>{n.pkg=e.target.value})}>${['Civil','Mechanical','Electrical'].map(x=>html`<option>${x}</option>`)}</select></div>
        <${StatusSelect} o=${o}/>
        <div class="field" style="flex:1 1 280px;min-width:0"><label for="subj">Subject</label><input class="input sm" id="subj" value=${d.subject} onInput=${e=>up(n=>{n.subject=e.target.value})}/></div>
        <div class="cfgacts">${dirty?html`<span class="badge amber">Unsaved changes</span>`:html`<span class="badge pending">Saved</span>`}
          ${askCancel?html`<span class="confirm"><span class="muted" style="font-size:.75rem">Discard changes?</span><button class="btn btn-danger btn-xs" type="button" onClick=${()=>{setD(snap());setErrs({});setAskCancel(false);setMode('view')}}>Discard</button><button class="btn btn-outline btn-xs" type="button" onClick=${()=>setAskCancel(false)}>Keep editing</button></span>`:
          html`<button class="btn btn-outline btn-sm" type="button" onClick=${()=>dirty?setAskCancel(true):setMode('view')}>Cancel</button><button class="btn btn-primary btn-sm" type="button" disabled=${!dirty} onClick=${save}>Save</button>`}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><div><h3>Work location and work area mapping</h3><p class="muted" style="font-size:.75rem;margin-top:2px">Plots and blocks this order covers. Only mapped blocks can be allocated in Work Management.</p></div>
        <button class="btn btn-outline btn-sm" type="button" onClick=${()=>up(n=>{n.locs.push({plot:'',blocks:[]})})}>${I('plus','sm')}Add work location</button></div>
      <div class="card-b stack" style="gap:12px">
        ${errs.locs?html`<div class="alert err" data-err="locs">${I('alert','sm')}<span>${errs.locs}</span></div>`:null}
        ${!d.locs.length?html`<div class="empty" style="padding:20px"><h4>No work locations</h4><p>Add a plot and pick its blocks.</p></div>`:null}
        ${d.locs.map((l,i)=>html`<div class="locrow" key=${'loc'+i}>
          <div class="field"><label for=${'plot'+i}>Work location (plot)</label><input class="input" id=${'plot'+i} placeholder="e.g. S-05b" value=${l.plot} aria-invalid=${!!errs['plot'+i]} onInput=${e=>up(n=>{n.locs[i].plot=e.target.value})}/>${E('plot'+i)}</div>
          <div class="field" style="min-width:0"><span style="font:500 .8125rem var(--font-sans)">Work area (blocks) · ${l.blocks.length} selected</span>
            <div class="blkpick" role="group" aria-label=${'Blocks for '+(l.plot||'this plot')}>${BLOCKS.map(b=>{const on=l.blocks.includes(b.id), elsewhere=!on&&usedBlocks(b.id); return html`<button type="button" class="bchip" aria-pressed=${on} disabled=${elsewhere} title=${elsewhere?'Mapped to another plot':''} onClick=${()=>up(n=>{const bl=n.locs[i].blocks; const k=bl.indexOf(b.id); k>-1?bl.splice(k,1):bl.push(b.id); bl.sort();})}>${b.id}</button>`})}</div>${E('blk'+i)}</div>
          <button class="btn btn-ghost btn-sm btn-icon" type="button" aria-label=${'Delete work location '+(l.plot||i+1)} style="margin-top:22px" onClick=${()=>up(n=>{n.locs.splice(i,1)})}>${I('trash','sm')}</button>
        </div>`)}
      </div>
    </div>

    <div class="toolbar"><div class="l"><h3 style="font:600 .9375rem var(--font-sans)">S.O. activities</h3><span class="muted" style="font-size:.8125rem">${d.acts.length} lines · value ₹ ${fmt(Math.round(total),0)}</span></div>
      <div class="rr"><div class="search">${I('search','sm')}<input class="input" placeholder="Search activity or service code" value=${q} onInput=${e=>setQ(e.target.value)} aria-label="Search activities"/></div>
        <button class="btn btn-primary btn-sm" type="button" onClick=${addAct}>${I('plus','sm')}Add S.O. activity</button></div></div>

    ${!shown.length?html`<div class="card"><div class="empty"><h4>No activities match</h4><p>Clear the search or add an activity.</p></div></div>`:null}
    ${shown.map(({a,i})=>{const long=(a.desc||a.name); const tot=(Number(a.soQty)||0)*(Number(a.rate)||0); const avail=opts.filter(x=>!a.site.some(s=>s.name===x));
      return html`<div class="card soact" key=${'act'+i}>
      <div class="actbar">
        <div class="field" style="min-width:0"><label for=${'name'+i}>S.O. activity${a.manual?html` <span class="badge info" style="margin-left:6px">Added manually</span>`:html` <span class="badge pending" style="margin-left:6px">From SAP</span>`}</label>
          ${a.manual?html`<input class="input" id=${'name'+i} placeholder="Activity description as in the price schedule" value=${a.name} aria-invalid=${!!errs['name'+i]} onInput=${e=>up(n=>{n.acts[i].name=e.target.value;n.acts[i].desc=e.target.value})}/>`:
          html`<div class="descbox ${more[i]?'open':''}" id=${'name'+i}><span>${long}</span>${long.length>70?html`<button class="linkbtn" type="button" onClick=${()=>setMore({...more,[i]:!more[i]})}>${more[i]?'Show less':'Read more'}</button>`:null}</div>`}${E('name'+i)}</div>
        <div class="field" style="min-width:0"><label for=${'pick'+i}>Site activity</label>
          <div style="display:flex;gap:8px"><select class="select" id=${'pick'+i} value=${pick[i]||''} onChange=${e=>setPick({...pick,[i]:e.target.value})}><option value="">${avail.length?'Choose site activity…':'All options added'}</option>${avail.map(x=>html`<option>${x}</option>`)}</select>

        <div class="tablewrap"><table><thead><tr><th>Material</th><th>Unit</th><th class="r">Qty per ${a.uom}</th><th class="r">Stock</th><th><span class="sr-only">Remove</span></th></tr></thead><tbody>
          ${a.boq.map((b,k)=>html`<tr key=${b.mat}><td>${MATS[b.mat].n}<div class="muted mono" style="font-size:.6875rem">${b.mat}</div></td><td>${MATS[b.mat].u}</td><td class="r"><input class="input sm num" type="number" min="0" step="0.001" value=${b.per} aria-label=${'Quantity per unit for '+MATS[b.mat].n} onInput=${e=>up(n=>{n.acts[i].boq[k].per=Math.max(0,Number(e.target.value)||0)})}/></td><td class="r">${fmt(st.stock[b.mat])}</td><td class="r"><button class="btn btn-ghost btn-xs btn-icon" type="button" aria-label=${'Remove '+MATS[b.mat].n} onClick=${()=>up(n=>{n.acts[i].boq.splice(k,1)})}>${I('trash','sm')}</button></td></tr>`)}
          ${!a.boq.length?html`<tr><td colspan="5" class="muted c">No materials. Blocks on this activity will show Mat. alloc. as at risk.</td></tr>`:null}
        </tbody></table></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><select class="select" style="max-width:300px;height:30px;font-size:.8125rem" value=${pick['m'+i]||''} onChange=${e=>setPick({...pick,['m'+i]:e.target.value})} aria-label="Material to add"><option value="">Choose material…</option>${Object.keys(MATS).filter(m=>!a.boq.some(b=>b.mat===m)).map(m=>html`<option value=${m}>${MATS[m].n}</option>`)}</select>
          <button class="btn btn-outline btn-sm" type="button" disabled=${!pick['m'+i]} onClick=${()=>{up(n=>{n.acts[i].boq.push({mat:pick['m'+i],per:1})}); setPick({...pick,['m'+i]:''});}}>${I('plus','sm')}Add material</button></div>
      </div>`:null}

    ${dirty?html`<div class="savebar"><span>You have unsaved changes to this service order.</span><div style="display:flex;gap:8px"><button class="btn btn-outline btn-sm" type="button" onClick=${()=>{setD(snap());setErrs({});setMode('view')}}>Discard</button><button class="btn btn-primary btn-sm" type="button" onClick=${save}>Save</button></div></div>`:null}

}

    <div class="tablewrap"><table><thead><tr><th>#</th><th>Service code</th><th>S.O. activities</th><th>Site activities</th><th class="r">S.O. qty</th><th class="r">Mapped</th><th class="r">Complete</th><th>Progress</th><th>UoM</th><th class="r"><span class="sr-only">Open</span></th></tr></thead><tbody>
      ${rows.map(a=>{const m=mappedQty(st,o.so,a.code), c=doneQty(st,o.so,a.code), pm=Math.min(100,m/a.soQty*100), pc=m?Math.min(100,c/m*100):0; return html`<tr class="clickable" key=${a.code} onClick=${()=>go('so.'+o.so+'.map.'+a.code+'.alloc')}>
        <td class="mono">${a.line}</td><td class="mono">${a.code}</td><td style="text-transform:uppercase">${a.name}</td><td class="wrap muted">${a.site.map(s=>s.name).join(' · ')||'—'}</td>
        <td class="r">${fmt(a.soQty)}</td><td class="r">${fmt(m)}</td><td class="r">${fmt(c)}</td>
        <td><div class="duo" title=${Math.round(pm)+'% mapped, '+Math.round(pc)+'% of mapped complete'}><div class="meter"><i style=${'width:'+pm+'%'}></i></div><div class="meter green"><i style=${'width:'+pc+'%'}></i></div></div></td><td>${a.uom}</td>
        <td class="r" onClick=${e=>e.stopPropagation()}><div style="display:inline-flex;gap:6px"><button class="btn btn-outline btn-xs" type="button" onClick=${()=>go('so.'+o.so+'.map.'+a.code+'.alloc')}>Allocate</button><button class="btn btn-outline btn-xs" type="button" disabled=${!m} onClick=${()=>go('so.'+o.so+'.map.'+a.code+'.done')}>Completion</button></div></td></tr>`})}
      ${!rows.length?html`<tr><td colspan="10"><div class="empty"><h4>No lines match</h4><p>Clear the search.</p></div></td></tr>`:null}
    </tbody></table></div>

/* ---- Plant map (allocation, completion, requisition) ---- */
const MODES=[['alloc','Work area allocation'],['done','Work completion'],['mirs','Material requisition']];
const LEG={alloc:[['sel','Current selection'],['others','Allocated to others'],['none','Not yet allocated'],['notreq','Allocated · material not requested'],['requested','Material requested'],['issued','Material issued'],['used','Work complete'],['mixed','Mixed status'],['scope','Not in scope']],
  done:[['sel','Current selection'],['others','Allocated to others'],['none','Not yet allocated'],['notreq','Allocated · material not requested'],['requested','Material requested'],['issued','Material issued'],['used','Work complete'],['mixed','Mixed status']],
  mirs:[['sel','Current selection'],['scope','Not in scope'],['notreq','Allocated · material not requested'],['requested','Material requested'],['issued','Material issued'],['used','Work complete'],['return','Return raised'],['mixed','Mixed status']]};
function MapScreen({so,act,mode}){
  const {st,ix,dispatch,go,toast}=useApp(); const o=soById(st,so); const a=o.acts.find(x=>x.code===act)||o.acts[0];
  const plots=(o.locs||[]).map(l=>l.plot);
  const [plot,setPlot]=useState(plots[0]||''); const [blk,setBlk]=useState('All'); const [sel,setSel]=useState(()=>{const b=new URLSearchParams(location.search).get('sel'); return new Set(b&&BTABLES[b]?BTABLES[b]:[]);}); const [msg,setMsg]=useState(null); const [lasso,setLasso]=useState(null);
  const [qty,setQty]=useState({}); const [chk,setChk]=useState({});
  const mapRef=useRef(); const drag=useRef(null);
  const first=useRef(true); useEffect(()=>{ if(first.current){first.current=false;return;} setSel(new Set());setMsg(null)},[act,mode,plot]);
  const scope=useMemo(()=>new Set((o.locs||[]).flatMap(l=>l.blocks).flatMap(b=>BTABLES[b])),[o.locs]);
  const mine=get(st.alloc,so,a.code), done=get(st.done,so,a.code);
  const status=t=>tStatus(st,ix,o,a,t,scope);
  const selectable=t=>{const s=status(t); if(mode==='alloc') return s!=='scope'&&s!=='others'; if(mode==='done') return mine.includes(t)&&s!=='used'; return mine.includes(t);};
  const plotBlocks=(PLOTS.find(p=>p.id===plot)||{blocks:[]}).blocks.filter(b=>(o.locs||[]).some(l=>l.blocks.includes(b)));
  const shownBlocks=blk==='All'?plotBlocks:[blk];
  const rowOff=shownBlocks.length?Math.min(...shownBlocks.map(b=>spanOf(BLOCKS.find(x=>x.id===b).r).start))-1:0;
  const rel=e=>{const r=mapRef.current.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  const down=e=>{ if(e.button!==0||e.target.closest('.maptools,.blabel')) return; drag.current={s:rel(e),moved:false}; try{mapRef.current.setPointerCapture(e.pointerId)}catch(_){}};
  const move=e=>{const d=drag.current; if(!d) return; const p=rel(e); if(!d.moved&&Math.abs(p.x-d.s.x)+Math.abs(p.y-d.s.y)<6) return; d.moved=true;
    const x=Math.min(p.x,d.s.x),y=Math.min(p.y,d.s.y),w=Math.abs(p.x-d.s.x),hh=Math.abs(p.y-d.s.y); setLasso({x,y,w,h:hh});
    const mr=mapRef.current.getBoundingClientRect(); const n=new Set(e.shiftKey?sel:[]);
    mapRef.current.querySelectorAll('.tb').forEach(el=>{const r=el.getBoundingClientRect(),bx=r.left-mr.left,by=r.top-mr.top; if(bx<x+w&&bx+r.width>x&&by<y+hh&&by+r.height>y&&selectable(el.dataset.t)) n.add(el.dataset.t)}); setSel(n); setMsg(null);};
  const up=e=>{const d=drag.current; drag.current=null; setLasso(null); if(d&&!d.moved){const el=document.elementFromPoint(e.clientX,e.clientY); const b=el&&el.closest('.tb'); if(b) toggle(b.dataset.t);}};
  const why=t=>{const s=status(t); if(s==='scope') return 'This table is outside the order’s work area. Map its block in S.O. Config.'; if(s==='others') return 'This table is allocated to another contractor for this activity.'; if(mode!=='alloc'&&!mine.includes(t)) return 'Allocate this table first in Work area allocation.'; if(s==='used') return 'This table is already complete.'; return '';};
  const toggle=t=>{ if(!selectable(t)){setMsg({k:'info',t:why(t)});return;} setSel(s=>{const n=new Set(s); n.has(t)?n.delete(t):n.add(t); return n}); setMsg(null);};
  const toggleBlock=b=>{const ts=BTABLES[b].filter(selectable); if(!ts.length){setMsg({k:'info',t:'Nothing selectable in '+b+' for this mode.'});return;} setSel(s=>{const n=new Set(s); const all=ts.every(t=>n.has(t)); ts.forEach(t=>all?n.delete(t):n.add(t)); return n}); setMsg(null);};
  const S=[...sel]; const selQty=roundQ(S.reduce((t,x)=>t+tq(a,x),0),a.uom);
  const counts={}; S.forEach(t=>{const l=TBL[t].label; counts[l]=(counts[l]||0)+1});
  const mapped=mappedQty(st,so,a.code), used=doneQty(st,so,a.code);
  /* actions */
  const allocate=()=>{const nw=S.filter(t=>!mine.includes(t)); if(!nw.length){setMsg({k:'info',t:'Selected tables are already allocated to this activity.'});return;} const add=roundQ(nw.reduce((t,x)=>t+tq(a,x),0),a.uom); const over=roundQ(mapped+add-a.soQty,a.uom);
    if(over>0){setMsg({k:'err',t:'Exceeds the S.O. quantity by '+fmt(over)+' '+a.uom+'. Deselect tables or ask for an amendment.'});return;}
    dispatch({t:'allocate',so,act:a.code,ts:nw}); setSel(new Set()); setMsg({k:'ok',t:'Allocated '+nw.length+' tables ('+fmt(add)+' '+a.uom+').'}); toast('ok','Work allocated',nw.length+' tables · '+a.name);};
  const release=()=>{const rm=S.filter(t=>mine.includes(t)); const blocked=rm.filter(t=>done.includes(t)||status(t)!=='notreq'); if(blocked.length){setMsg({k:'err',t:blocked.length+' selected tables already have material requested, issued or work completed. Only tables with no material activity can be released.'});return;} if(!rm.length) return; dispatch({t:'release',so,act:a.code,ts:rm}); setSel(new Set()); setMsg({k:'ok',t:'Released '+rm.length+' tables.'});};
  const complete=()=>{ const noMat=a.boq.length?S.filter(t=>status(t)!=='issued'):[]; if(noMat.length){setMsg({k:'err',t:noMat.length+' of '+S.length+' selected tables do not have all material issued. Work can only be completed on tables with material issued.',fix:S.filter(t=>!noMat.includes(t))});return;}
    dispatch({t:'complete',so,act:a.code,ts:S}); setSel(new Set()); setMsg({k:'ok',t:'Marked '+S.length+' tables complete ('+fmt(selQty)+' '+a.uom+'). They are now in measurement review under WMC.'}); toast('ok','Work completion submitted',S.length+' tables sent for measurement review.');};
  /* requisition rows */
  const mrows=a.boq.map(b=>{const u=MATS[b.mat].u; let req=0,iss=0,pd=0,usd=0; S.forEach(t=>{const need=tq(a,t)*b.per; const k=so+'|'+a.code+'|'+t+'|'+b.mat; req+=need; iss+=ix.iss[k]||0; pd+=ix.pend[k]||0; if(done.includes(t)) usd+=need;}); return {mat:b.mat,u,req:roundQ(req,u),iss:roundQ(iss,u),pd:roundQ(pd,u),usd:roundQ(usd,u),rem:roundQ(Math.max(0,req-iss-pd),u)}});
  useEffect(()=>{ if(mode!=='mirs') return; const q={},c={}; mrows.forEach(r=>{q[r.mat]=r.rem?String(r.rem):''; c[r.mat]=r.rem>0}); setQty(q); setChk(c); },[mode,sel,st.res.length]);
  const [just,setJust]=useState(''); const [exr,setExr]=useState('');
  const merr={}; mrows.forEach(r=>{ if(!chk[r.mat]) return; const n=Number(qty[r.mat]); if(!(n>0)) merr[r.mat]='Above 0'; });
  const excess=mrows.filter(r=>chk[r.mat]&&Number(qty[r.mat])>r.rem+1e-9); const unused=mrows.filter(r=>chk[r.mat]&&r.iss-r.usd>1e-9);
  const chosen=mrows.filter(r=>chk[r.mat]);
  const raise=()=>{ if(!S.length){setMsg({k:'info',t:'Select allocated tables on the map first.'});return;} if(!chosen.length||Object.keys(merr).length){setMsg({k:'err',t:'Check the highlighted quantities.'});return;} if(unused.length&&!just.trim()){setMsg({k:'err',t:'Existing issued material pending utilization. Add a justification to raise this MR.'});return;} if(excess.length&&!exr.trim()){setMsg({k:'err',t:'Enter a reason for the extra quantity. It goes to the Plot Head for approval.'});return;}
    const lines=chosen.map(r=>{const b=a.boq.find(x=>x.mat===r.mat); const need={}; S.forEach(t=>{const k=so+'|'+a.code+'|'+t+'|'+r.mat; need[t]=Math.max(0,tq(a,t)*b.per-(ix.iss[k]||0)-(ix.pend[k]||0));}); const q=roundQ(Number(qty[r.mat]),r.u); if(!Object.values(need).some(x=>x>0)) S.forEach(t=>need[t]=tq(a,t)*b.per); return {mat:r.mat,qty:q,split:splitBy(need,q)}});
    const tsUsed=S.filter(t=>lines.some(l=>l.split[t]>0));
    dispatch({t:'raise',x:{type:'MIRS',so,act:a.code,tables:tsUsed,lines,by:st.user.name,justification:unused.length?just.trim():'',excess:excess.length?{reason:exr.trim(),mats:excess.map(r=>({mat:r.mat,extra:roundQ(Number(qty[r.mat])-r.rem,r.u)}))}:null}}); setJust(''); setExr(''); setSel(new Set()); setMsg({k:'ok',t:'Reservation raised for '+lines.length+' materials across '+tsUsed.length+' tables. Stores can issue it in Reservations & Posting.'}); toast('ok','Reservation raised','MIRS created for '+tsUsed.length+' tables.');};
  const short=chosen.filter(r=>Number(qty[r.mat])>st.stock[r.mat]);
  const primary=o.status==='Completed'?html`<span class="badge done"><i class="mark done"></i>S.O. completed · read only</span>`:mode==='alloc'?html`<${Gate} k="allocate"><div style="display:flex;gap:6px"><button class="btn btn-outline btn-sm" type="button" disabled=${!S.some(t=>mine.includes(t))} onClick=${release}>Release tables</button><button class="btn btn-primary btn-sm" type="button" disabled=${!S.length} onClick=${allocate}>Allocate</button></div><//>`
    :mode==='done'?html`<${Gate} k="complete"><button class="btn btn-primary btn-sm" type="button" disabled=${!S.length} onClick=${complete}>Mark complete</button><//>`
    :html`<${Gate} k="mirs"><button class="btn btn-caution btn-sm" type="button" disabled=${!S.length||!chosen.length} onClick=${raise}>Raise reservation</button><//>`;
  const back=mode==='mirs'?'so.'+so+'.mirs':'so.'+so+'.work';
  const mapEl=html`<div class="map2" ref=${mapRef} onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${()=>{drag.current=null;setLasso(null)}} aria-label="Plant layout. Drag to select tables, click a block name to select the whole block.">
      ${!shownBlocks.length?html`<div class="empty"><h4>No blocks mapped for this plot</h4><p>Map work areas in S.O. Config.</p></div>`:null}
      <div class=${'plant2'+(blk!=='All'?' one':'')}>${shownBlocks.map(bid=>{const b=BLOCKS.find(x=>x.id===bid); const rs=spanOf(b.r), cs=spanOf(b.c);
        return html`<div class="blk2" key=${bid} style=${blk!=='All'?'grid-column:1 / span 12;grid-row:1 / span 3':'grid-column:'+b.c+';grid-row:'+(rs.start-rowOff)+' / span '+rs.span}>
          <button type="button" class="blabel" onClick=${()=>toggleBlock(bid)} aria-label=${'Select selectable tables in '+bid}>${bid}<small>${b.size} HSAT</small></button>
          <div class="tgrid" style=${'grid-template-columns:repeat('+b.cols+',1fr);grid-template-rows:repeat('+b.trows+',1fr)'}>${BTABLES[bid].map(t=>{const s=status(t); return html`<i class=${'tb s-'+s+(sel.has(t)?' sel':'')} data-t=${t} key=${t} title=${t+' · '+TBL[t].label}></i>`})}</div></div>`})}</div>
      ${lasso&&html`<div class="lasso" style=${{left:lasso.x+'px',top:lasso.y+'px',width:lasso.w+'px',height:lasso.h+'px'}}></div>`}
    </div>`;
  const legend=html`<div class="legend2" aria-label="Legend"><b>Legend</b>${LEG[mode].map(([k,l])=>html`<span><i class=${'lg s-'+k}></i>${l}</span>`)}</div>`;
  const msgEl=msg&&html`<div class=${'alert '+(msg.k==='err'?'err':msg.k==='ok'?'ok':'info')} role="status">${I(msg.k==='err'?'alert':msg.k==='ok'?'check':'info','sm')}<span style="flex:1">${msg.t}</span>${msg.fix&&msg.fix.length?html`<button class="btn btn-outline btn-xs" type="button" onClick=${()=>{setSel(new Set(msg.fix));setMsg(null)}}>Select eligible only (${msg.fix.length})</button>`:null}</div>`;
  return html`<${Top} crumbs=${[{l:'Projects',to:'projects'},{l:st.projects.find(p=>p.id===o.pid).name,to:'p.'+o.pid+'.overview'},{l:'SO '+so,to:back},{l:MODES.find(m=>m[0]===mode)[1]}]}/>
  <div class="mapbar">
    <${BackBtn} to=${back} label=${mode==='mirs'?'MIRS':'Work Management'}/>
    <label class="mb-f"><span>Mode</span><select class="select" style="min-width:200px" value=${mode} onChange=${e=>go('so.'+so+'.map.'+a.code+'.'+e.target.value)}>${MODES.map(([k,l])=>html`<option value=${k}>${l}</option>`)}</select></label>
    <div class="mb-f"><span>Service order</span><b class="mb-val mono">${so}</b></div>
    <label class="mb-f"><span>S.O. activity</span><select class="select" value=${a.code} onChange=${e=>go('so.'+so+'.map.'+e.target.value+'.'+mode)}>${o.acts.map(x=>html`<option value=${x.code}>${x.name}</option>`)}</select></label>
    <label class="mb-f"><span>Plot</span><select class="select" value=${plot} onChange=${e=>{setPlot(e.target.value);setBlk('All')}}>${plots.map(p=>html`<option>${p}</option>`)}</select></label>
    <label class="mb-f"><span>Block</span><select class="select" value=${blk} onChange=${e=>setBlk(e.target.value)}><option value="All">All</option>${plotBlocks.map(b=>html`<option>${b}</option>`)}</select></label>
    <div style="margin-left:auto">${primary}</div>
  </div>
  <main class="mapmain">
