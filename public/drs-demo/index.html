/* ---- MRRS (process doc 5.2.1 #7, 5.3.1 #3-4) ---- */
function Mrrs({o}){
  const {st,dispatch,toast}=useApp(); const [act,setAct]=useState('ALL'); const [q,setQ]=useState(''); const [sort,setSort]=useState(1); const [qty,setQty]=useState({}); const [chk,setChk]=useState({}); const [cond,setCond]=useState({}); const [reason,setReason]=useState('Surplus after completion'); const [rem,setRem]=useState(''); const [docName,setDoc]=useState(''); const [err,setErr]=useState('');
  const acts=act==='ALL'?o.acts:o.acts.filter(a=>a.code===act);
  let rows=[]; acts.forEach(a=>a.boq.forEach(b=>{const u=MATS[b.mat].u; const mp=roundQ(get(st.alloc,o.so,a.code).reduce((t,x)=>t+tq(a,x)*b.per,0),u); const iss=roundQ(netIssued(st,o.so,a.code,b.mat),u); const usd=roundQ(get(st.done,o.so,a.code).reduce((t,x)=>t+tq(a,x)*b.per,0),u);
    const rr=st.res.filter(r=>r.type==='MRRS'&&r.so===o.so&&r.act===a.code&&!['Withdrawn','Rejected'].includes(r.status)); const resv=roundQ(rr.filter(r=>r.status!=='Closed').reduce((t,r)=>t+r.lines.filter(l=>l.mat===b.mat).reduce((x,l)=>x+l.qty-l.posted,0),0),u); const ret=roundQ(rr.reduce((t,r)=>t+r.lines.filter(l=>l.mat===b.mat).reduce((x,l)=>x+l.posted,0),0),u);
    if(iss<=0&&ret<=0) return; rows.push({k:a.code+'|'+b.mat,a,mat:b.mat,u,mp,iss,usd,resv,ret,inv:st.stock[b.mat],max:roundQ(Math.max(0,iss-usd-resv),u)});}));
  rows=rows.filter(r=>(r.mat+MATS[r.mat].n).toLowerCase().includes(q.toLowerCase())).sort((x,y)=>sort*MATS[x.mat].n.localeCompare(MATS[y.mat].n));
  const errs={}; rows.forEach(r=>{ if(!chk[r.k]) return; const n=Number(qty[r.k]); if(!(n>0)) errs[r.k]='Above 0'; else if(n>r.max+1e-9) errs[r.k]=r.max<=0?'Cannot return material already marked as used.':'Max '+fmt(r.max); });
  const chosen=rows.filter(r=>chk[r.k]); const bad=chosen.filter(r=>(cond[r.k]||'Good')!=='Good');
  const raise=()=>{ setErr(''); if(!chosen.length||Object.keys(errs).length) return; if(bad.length&&(!rem.trim()||!docName)){setErr('Damaged or unfit material needs a reason and a supporting document before the return can be raised.');return;}
    const by={}; chosen.forEach(r=>{(by[r.a.code]=by[r.a.code]||[]).push({mat:r.mat,qty:roundQ(Number(qty[r.k]),r.u),cond:cond[r.k]||'Good'})});
    Object.keys(by).forEach(c=>dispatch({t:'raise',x:{type:'MRRS',so:o.so,act:c,lines:by[c],reason,by:st.user.name,damaged:by[c].some(l=>l.cond!=='Good')?{remarks:rem.trim(),doc:docName}:null}}));
    setChk({}); setQty({}); setCond({}); setRem(''); setDoc(''); toast('ok','Return reservation raised',Object.keys(by).length+' MRRS · stores receives it in Reservations & Posting.');};
  const siteActs=acts.flatMap(a=>a.site.map(s=>s.name)); const closed=o.status==='Completed';
  return html`<div class="stack">
    <${SOHead} o=${o} extra=${html`
      <div class="field" style="width:240px"><label for="mra">S.O. activity</label><select class="select" style="height:32px;font-size:.8125rem" id="mra" value=${act} onChange=${e=>{setAct(e.target.value);setChk({});setQty({})}}><option value="ALL">ALL</option>${o.acts.map(a=>html`<option value=${a.code}>${a.name}</option>`)}</select></div>
      <div class="kv2" style="min-width:0;max-width:300px"><span>Site activity</span><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title=${siteActs.join(', ')}>${siteActs.join(', ')||'—'}</b></div>
      <div class="field" style="width:200px"><label for="mrr">Reason</label><select class="select" style="height:32px;font-size:.8125rem" id="mrr" value=${reason} onChange=${e=>setReason(e.target.value)}>${['Surplus after completion','Damaged in handling','Wrong specification','Scope change'].map(x=>html`<option>${x}</option>`)}</select></div>
      <div class="cfgacts">${closed?html`<span class="badge done">S.O. completed</span>`:html`<${Gate} k="mrrs"><button class="btn btn-caution btn-sm" type="button" disabled=${!chosen.length||!!Object.keys(errs).length} onClick=${raise}>Return reservation${chosen.length?' ('+chosen.length+')':''}</button><//>`}</div>`}/>
    <div class="toolbar"><div class="search">${I('search','sm')}<input class="input" placeholder="Search material" value=${q} onInput=${e=>setQ(e.target.value)} aria-label="Search materials"/></div>
      <button class="btn btn-ghost btn-sm" type="button" onClick=${()=>setSort(-sort)}>Sort by name ${sort>0?'A–Z':'Z–A'}</button></div>
    ${rows.length?html`<div class="tablewrap"><table><thead><tr><th><span class="sr-only">Select</span></th><th>Material code</th><th>Material name</th>${act==='ALL'?html`<th>Activity</th>`:null}<th class="r">Mapped</th><th class="r">Issued</th><th class="r">Used</th><th class="r">Resv. for return</th><th class="r">Returned</th><th class="r">Inventory</th><th class="r">Qty for return</th><th>Condition</th><th>UoM</th></tr></thead><tbody>
      ${rows.map(r=>html`<tr key=${r.k} class=${chk[r.k]&&(cond[r.k]||'Good')!=='Good'?'warnrow':''}><td><input class="check" type="checkbox" checked=${!!chk[r.k]} disabled=${closed} onChange=${e=>{setChk({...chk,[r.k]:e.target.checked}); if(e.target.checked&&!qty[r.k]) setQty({...qty,[r.k]:String(r.max)})}} aria-label=${'Select '+MATS[r.mat].n}/></td>
        <td class="mono">${r.mat}</td><td>${MATS[r.mat].n}</td>${act==='ALL'?html`<td class="muted">${r.a.name}</td>`:null}<td class="r">${fmt(r.mp)}</td><td class="r">${fmt(r.iss)}</td><td class="r">${fmt(r.usd)}</td><td class="r">${fmt(r.resv)}</td><td class="r">${fmt(r.ret)}</td><td class="r">${fmt(r.inv)}</td>
        <td class="r"><div style="display:inline-grid;gap:2px;justify-items:end"><input class="input sm num" type="number" min="0" step="any" placeholder="0" value=${qty[r.k]||''} disabled=${!chk[r.k]} onInput=${e=>setQty({...qty,[r.k]:e.target.value})} aria-label=${'Return quantity for '+MATS[r.mat].n} aria-invalid=${!!errs[r.k]}/>${errs[r.k]?html`<span style="color:var(--red-11);font-size:.6875rem;max-width:180px;white-space:normal;text-align:right">${errs[r.k]}</span>`:null}</div></td>
        <td><select class="select" style="height:30px;width:110px;font-size:.75rem" value=${cond[r.k]||'Good'} disabled=${!chk[r.k]} aria-label=${'Condition of '+MATS[r.mat].n} onChange=${e=>setCond({...cond,[r.k]:e.target.value})}>${['Good','Damaged','Unfit'].map(x=>html`<option>${x}</option>`)}</select></td><td>${r.u}</td></tr>`)}
    </tbody></table></div>`:html`<div class="card"><div class="empty"><h4>Nothing issued yet</h4><p>Materials appear here once stores issues them against this order.</p></div></div>`}
    ${bad.length?html`<div class="card" style="border-color:var(--red-6)"><div class="card-b stack" style="gap:10px"><div class="alert err">${I('alert','sm')}<span><b>Damaged or unfit material</b> (${bad.map(r=>MATS[r.mat].n).join(', ')}): a reason and a supporting document are required. Stores will see them when receiving.</span></div>
      <div class="field"><label for="dmg-r">Reason / remarks<span style="color:var(--red-11)"> *</span></label><textarea class="input" id="dmg-r" rows="2" style="height:auto;padding:8px 12px" value=${rem} onInput=${e=>setRem(e.target.value)} placeholder="What happened and where?"></textarea></div>
      <div class="field"><label for="dmg-d">Supporting document<span style="color:var(--red-11)"> *</span></label><input class="input" id="dmg-d" type="file" style="padding-top:6px" onChange=${e=>setDoc(e.target.files[0]?e.target.files[0].name:'')}/><button class="btn btn-ghost btn-xs" type="button" style="justify-self:start" onClick=${()=>setDoc('damage-photo-B01.jpg')}>Use a sample photo</button>${docName?html`<span class="hint mono">${docName}</span>`:null}</div></div></div>`:null}
    ${err?html`<div class="alert err">${I('alert','sm')}<span>${err}</span></div>`:null}
    <p class="muted" style="font-size:.75rem">Returnable = issued − used (completed tables × unit BoQ) − already reserved for return. Material marked as used cannot be returned.</p>
  </div>`;
}

/* ---- Reservations & posting (process doc 5.2.2, 5.3.1) ---- */
function Reservations({o}){
  const {st,dispatch,toast}=useApp(); const [act,setAct]=useState('ALL'); const [q,setQ]=useState(''); const [open,setOpen]=useState({}); const [cur,setCur]=useState(null); const [menu,setMenu]=useState(null); const [ask,setAsk]=useState(null); const [qty,setQty]=useState({}); const [rej,setRej]=useState(null); const [rejNote,setRejNote]=useState(''); const [busy,setBusy]=useState(false);
  const list=st.res.filter(r=>r.so===o.so&&(act==='ALL'||r.act===act)&&(r.id+r.slip).toLowerCase().includes(q.toLowerCase()));
  const sel=list.find(r=>r.id===cur)||list.find(r=>['Pending approval','Open','Partially posted'].includes(r.status))||list[0];
  const isI=sel&&sel.type==='MIRS'; const live=sel&&(sel.status==='Open'||sel.status==='Partially posted'); const pend=sel&&sel.status==='Pending approval';
  useEffect(()=>{ if(!sel) return; const m={}; sel.lines.forEach(l=>{const left=roundQ(l.qty-l.posted,MATS[l.mat].u); m[l.mat]=String(Math.max(0,isI?Math.min(left,st.stock[l.mat]):left))}); setQty(m); },[sel&&sel.id,sel&&sel.status,st.docs.length]);
  const err={}; if(sel) sel.lines.forEach(l=>{const left=roundQ(l.qty-l.posted,MATS[l.mat].u); const n=Number(qty[l.mat]||0); if(n<0) err[l.mat]='0 or more'; else if(n>left+1e-9) err[l.mat]='Max '+fmt(left); else if(isI&&n>st.stock[l.mat]+1e-9) err[l.mat]='Insufficient stock: '+fmt(st.stock[l.mat]); });
  const any=sel&&sel.lines.some(l=>Number(qty[l.mat]||0)>0); const short=sel&&isI&&sel.lines.some(l=>st.stock[l.mat]<l.qty-l.posted-1e-9);
  const post=()=>{ setBusy(true); setTimeout(()=>{ dispatch({t:'post',id:sel.id,q:Object.fromEntries(Object.entries(qty).map(([k,v])=>[k,Number(v)||0]))}); setBusy(false); toast('ok',isI?'Issue posted in SAP':'Return posted in SAP',sel.id+' · movement '+(isI?'971':'972')+' synced to DRS (simulated).'); },700); };
  const actName=c=>(o.acts.find(a=>a.code===c)||{}).name||c;
  const siteActs=(act==='ALL'?o.acts:o.acts.filter(a=>a.code===act)).flatMap(a=>a.site.map(s=>s.name));
  return html`<div class="stack">
    <${SOHead} o=${o} extra=${html`<div class="field" style="width:260px"><label for="rsa">S.O. activity</label><select class="select" style="height:32px;font-size:.8125rem" id="rsa" value=${act} onChange=${e=>{setAct(e.target.value);setCur(null)}}><option value="ALL">ALL</option>${o.acts.map(a=>html`<option value=${a.code}>${a.name}</option>`)}</select></div>
      <div class="kv2" style="min-width:0;max-width:360px"><span>Site activity</span><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title=${siteActs.join(', ')}>${siteActs.join(', ')||'—'}</b></div><div class="cfgacts"><span class="badge pending" title="In the live system stores posts issues and returns in SAP and DRS reads them back.">SAP sync · simulated</span></div>`}/>
    <div class="resgrid">
      <div class="card" style="overflow:hidden"><div class="card-h"><h3>Requisition list <span class="muted" style="font-weight:400">(Total ${list.length})</span></h3><div class="search" style="width:180px">${I('search','sm')}<input class="input sm" style="padding-left:30px" placeholder="Search" value=${q} onInput=${e=>setQ(e.target.value)} aria-label="Search reservations"/></div></div>
        ${list.length?html`<div class="tablewrap" style="border:0;border-radius:0"><table><thead><tr><th><span class="sr-only">Expand</span></th><th>Resv. no.</th><th>Date</th><th>Mvmt</th><th>Status</th><th class="r"><span class="sr-only">Actions</span></th></tr></thead><tbody>
          ${list.map(r=>{const docs=st.docs.filter(d=>d.res===r.id); const isSel=sel&&sel.id===r.id; const canW=['Open','Partially posted','Pending approval'].includes(r.status)&&can(st,r.type==='MIRS'?'mirs':'mrrs'); return html`<${Fragment} key=${r.id}>
            <tr class=${'clickable'+(isSel?' rowsel':'')} onClick=${()=>{setCur(r.id);setMenu(null)}}>
              <td onClick=${e=>e.stopPropagation()}><button class="btn btn-ghost btn-xs btn-icon" type="button" aria-expanded=${!!open[r.id]} aria-label=${'Show posting documents of '+r.id} disabled=${!docs.length} onClick=${()=>setOpen({...open,[r.id]:!open[r.id]})}>${open[r.id]?'−':'+'}</button></td>

            <td class="r">${isI&&st.stock[l.mat]<left?html`<span class="badge risk"><i class="mark risk"></i>${fmt(st.stock[l.mat])}</span>`:fmt(st.stock[l.mat])}</td></tr>`})}

/* ================= BOQ RECONCILIATION ================= */
function BoqGen({pid}){
  const {st,toast}=useApp(); const sos=st.sos.filter(s=>s.pid===pid);
  const opts=[]; sos.forEach(s=>s.acts.forEach(a=>a.site.forEach((x,i)=>{ if(a.boq.length) opts.push({v:s.so+'|'+a.code+'|'+i,l:x.name+' · '+a.name,so:s,a,site:x}); })));
  const [ov,setOv]=useState(opts[0]?opts[0].v:''); const o=opts.find(x=>x.v===ov)||opts[0];
  const [plot,setPlot]=useState('S-05b'); const [blk,setBlk]=useState('All'); const [gen,setGen]=useState(null); const [q,setQ]=useState(''); const [sort,setSort]=useState(1);
  if(!o) return html`<div class="card"><div class="empty"><h4>No valid mapping data found in drawing. Auto-generation failed.</h4><p>No site activity on this project has a unit BoQ yet. Configure materials in S.O. Config first.</p></div></div>`;
  const sizes=[112,84,56]; const blocks=(PLOTS.find(p=>p.id===plot)||{blocks:[]}).blocks; const scopeBlocks=blk==='All'?blocks:[blk];
  const key=ov+'|'+plot+'|'+blk; const stale=gen&&gen.key!==key;
  const cnt={112:0,84:0,56:0}; scopeBlocks.forEach(b=>BTABLES[b].forEach(t=>cnt[TBL[t].size]++));
  let rows=o.a.boq.map(b=>({mat:b.mat,per:sizes.map(sz=>o.a.per[sz]*b.per*(o.site.ratio||1)),w:MATS[b.mat].w,u:MATS[b.mat].u}));
  rows=rows.filter(r=>(r.mat+MATS[r.mat].n).toLowerCase().includes(q.toLowerCase())).sort((x,y)=>sort*MATS[x.mat].n.localeCompare(MATS[y.mat].n));
  const generate=()=>{setGen({key,cnt:{...cnt},blocks:scopeBlocks}); toast('ok','BoQ generated',scopeBlocks.length+' blocks · '+(cnt[112]+cnt[84]+cnt[56])+' tables');};
  const G=gen&&!stale?gen:null; let totW=0;
  return html`<div class="stack">
    <p class="muted" style="font-size:.8125rem">Quantities per drawing asset come from the unit BoQ configurator. Generate multiplies them by the tables in the plot or blocks you choose, using the current drawing revision.</p>
    <div class="card"><div class="card-b cfghead">
      <div class="kv2"><span>Package</span><b>${o.so.pkg}</b></div>
      <div class="field" style="width:320px"><label for="bsa">Site activity</label><select class="select" style="height:32px;font-size:.8125rem" id="bsa" value=${ov} onChange=${e=>setOv(e.target.value)}>${opts.map(x=>html`<option value=${x.v}>${x.l}</option>`)}</select></div>
      <div class="field" style="width:140px"><label for="bpl">Plot</label><select class="select" style="height:32px;font-size:.8125rem" id="bpl" value=${plot} onChange=${e=>{setPlot(e.target.value);setBlk('All')}}>${PLOTS.map(p=>html`<option>${p.id}</option>`)}</select></div>
      <div class="field" style="width:140px"><label for="bbl">Blocks</label><select class="select" style="height:32px;font-size:.8125rem" id="bbl" value=${blk} onChange=${e=>setBlk(e.target.value)}><option value="All">All</option>${blocks.map(b=>html`<option>${b}</option>`)}</select></div>
      <div class="cfgacts">${stale?html`<span class="badge amber">Filters changed</span>`:null}<button class="btn btn-primary btn-sm" type="button" onClick=${generate}>${G?'Regenerate BoQ':'Generate BoQ'}</button></div>
    </div></div>
    <div class="toolbar"><div class="search">${I('search','sm')}<input class="input" placeholder="Search material" value=${q} onInput=${e=>setQ(e.target.value)} aria-label="Search materials"/></div><button class="btn btn-ghost btn-sm" type="button" onClick=${()=>setSort(-sort)}>Sort by name ${sort>0?'A–Z':'Z–A'}</button></div>
    <div class="tablewrap"><table><thead>
      <tr><th rowspan="2">Material code</th><th rowspan="2">Material name</th><th colspan="3" class="c" style="border-left:1px solid var(--border)">Material qty per DWG asset (Nos)</th><th rowspan="2" class="r" style="border-left:1px solid var(--border)">Weight / unit</th><th rowspan="2">UoM</th>${G?html`<th colspan="2" class="c" style="border-left:1px solid var(--border);background:var(--amber-2)">Generated for ${G.blocks.length===1?G.blocks[0]:plot}</th>`:null}</tr>
      <tr>${sizes.map(sz=>html`<th class="r" style=${sz===112?'border-left:1px solid var(--border)':''}>${sz} HSAT</th>`)}${G?html`<th class="r" style="border-left:1px solid var(--border);background:var(--amber-2)">Total qty</th><th class="r" style="background:var(--amber-2)">Weight (MT)</th>`:null}</tr></thead><tbody>
      ${rows.map(r=>{const tot=sizes.reduce((t,sz,i)=>t+(G?G.cnt[sz]:0)*r.per[i],0); const wt=tot*r.w; totW+=wt; return html`<tr key=${r.mat}><td class="mono">${r.mat}</td><td>${MATS[r.mat].n}</td>${r.per.map((v,i)=>html`<td class="r" style=${i===0?'border-left:1px solid var(--border)':''}>${v?fmt(r2(v),3):'—'}</td>`)}<td class="r" style="border-left:1px solid var(--border)">${fmt(r.w,5)}</td><td>MT</td>
        ${G?html`<td class="r" style="border-left:1px solid var(--border)"><b style="font-weight:600">${fmt(roundQ(tot,r.u))}</b> ${r.u}</td><td class="r">${fmt(r2(wt),2)}</td>`:null}</tr>`})}
      ${G?html`<tr><td colspan="7" class="r muted">Tables in scope: 112 × ${G.cnt[112]} · 84 × ${G.cnt[84]} · 56 × ${G.cnt[56]}</td><td class="r" style="border-left:1px solid var(--border)"><b>Total</b></td><td class="r"><b>${fmt(r2(totW),2)}</b></td></tr>`:null}
    </tbody></table></div>
    ${!G?html`<p class="muted" style="font-size:.75rem">${stale?'Filters changed since the last run. Generate again to refresh totals.':'Generate BoQ multiplies these per-asset quantities by the tables in the chosen plot or blocks.'}</p>`:null}
  </div>`;
}

/* ================= WMC (work measurement certificate) ================= */
const PK3={Civil:'CIV',Mechanical:'MEC',Electrical:'ELE'};
const plotOf=b=>(PLOTS.find(p=>p.blocks.includes(b))||{id:''}).id;
const wmCode=(o,b)=>'WM-'+plotOf(b).replace('-','').toUpperCase()+'-'+b.replace('-','')+'-'+PK3[o.pkg];
function measCounts(st,o,a,b){const ts=get(st.alloc,o.so,a.code).filter(t=>TBL[t].block===b); const c={total:ts.length,approved:0,review:0,rejected:0,pending:0}; ts.forEach(t=>{const m=st.meas[o.so+'|'+a.code+'|'+t]; if(m==='approved')c.approved++; else if(m==='review')c.review++; else if(m==='rejected')c.rejected++; else c.pending++;}); return c;}
function Wmc({pid}){
  const {st,dispatch,toast}=useApp(); const sos=st.sos.filter(s=>s.pid===pid&&(s.locs||[]).length);
  const [tab,setTab]=useState('wm'); const [soId,setSo]=useState(sos[0]?sos[0].so:''); const o=sos.find(s=>s.so===soId)||sos[0];
  const [item,setItem]=useState('All'); const [plot,setPlot]=useState('S-05b'); const [blk,setBlk]=useState('B-01'); const [view,setView]=useState('pending'); const [q,setQ]=useState(''); const [cert,setCert]=useState(null);
  if(!o) return html`<${ProjectLayout} pid=${pid} sec="wmc" crumbs=${[{l:'WMC'}]}><div class="ph"><div><h1>Work measurement</h1></div></div><div class="card"><div class="empty"><h4>No service orders with mapped work areas</h4><p>Map plots and blocks in S.O. Config to start measuring work.</p></div></div><//>`;
  const blocks=(PLOTS.find(p=>p.id===plot)||{blocks:[]}).blocks.filter(b=>(o.locs||[]).some(l=>l.blocks.includes(b)));
  const b=blocks.includes(blk)?blk:(blocks[0]||'');
  const acts=o.acts.filter(a=>item==='All'||a.code===item);
  const rows=acts.map(a=>({a,c:measCounts(st,o,a,b),gen:st.wmc.find(w=>w.so===o.so&&w.act===a.code&&w.block===b)})).filter(r=>r.c.total>0);
  const pend=rows.filter(r=>!r.gen&&r.c.approved<r.c.total), ready=rows.filter(r=>!r.gen&&r.c.total>0&&r.c.approved===r.c.total), gen=rows.filter(r=>r.gen);
  const listRows=view==='pending'?pend:view==='ready'?ready:gen;
  const total=rows.reduce((t,r)=>t+r.c.total,0);
  const isHead=can(st,'approve');
  const act=(type,r)=>{dispatch({t:'measure',so:o.so,act:r.a.code,block:b,v:type}); toast('ok',type==='approve'?'Measurement approved':type==='reject'?'Measurement rejected':'Sent back for rework',r.a.name+' · '+b);};
  const generate=()=>{ if(!ready.length) return; ready.forEach(r=>dispatch({t:'genWmc',so:o.so,act:r.a.code,block:b,code:wmCode(o,b).replace('WM-','WMC-')})); toast('ok','WMC generated',ready.length+' certificate'+(ready.length>1?'s':'')+' for '+b+'. Find them under Generated WMC and Total WMC.'); setView('gen');};
  const files=st.wmc.filter(w=>sos.some(s=>s.so===w.so)).filter(w=>(w.code+w.name).toLowerCase().includes(q.toLowerCase()));
  const VCLS={pending:'red',ready:'blue',gen:'green'};
  return html`<${ProjectLayout} pid=${pid} sec="wmc" crumbs=${[{l:'WMC'}]}>
    <div class="ph"><div><h1>Work measurement</h1><p>Completed tables are measured, approved by the plot head, then certified in a WMC for billing.</p></div></div>
    <div class="utabs" role="tablist" aria-label="WMC sections"><button class="utab" role="tab" type="button" aria-selected=${tab==='wm'} onClick=${()=>setTab('wm')}>Work Measurement</button><button class="utab" role="tab" type="button" aria-selected=${tab==='files'} onClick=${()=>setTab('files')}>Total WMC<span class="count">${files.length}</span></button></div>
    ${tab==='wm'?html`
    <div class="card"><div class="card-b cfghead">
      <div class="field" style="width:170px"><label for="wso">Service order</label><select class="select" style="height:32px;font-size:.8125rem" id="wso" value=${o.so} onChange=${e=>{setSo(e.target.value);setItem('All')}}>${sos.map(s=>html`<option>${s.so}</option>`)}</select></div>
      <div class="field" style="width:240px"><label for="wsi">Service item</label><select class="select" style="height:32px;font-size:.8125rem" id="wsi" value=${item} onChange=${e=>setItem(e.target.value)}><option value="All">All</option>${o.acts.map(a=>html`<option value=${a.code}>${a.code} · ${a.name}</option>`)}</select></div>
      <div class="field" style="width:130px"><label for="wpl">Work location</label><select class="select" style="height:32px;font-size:.8125rem" id="wpl" value=${plot} onChange=${e=>setPlot(e.target.value)}>${PLOTS.filter(p=>(o.locs||[]).some(l=>l.plot===p.id)).map(p=>html`<option>${p.id}</option>`)}</select></div>
      <div class="field" style="width:120px"><label for="wbl">Work area</label><select class="select" style="height:32px;font-size:.8125rem" id="wbl" value=${b} onChange=${e=>setBlk(e.target.value)}>${blocks.map(x=>html`<option>${x}</option>`)}</select></div>
      <div class="kv2"><span>Package</span><b>${o.pkg}</b></div>
      <div class="cfgacts">${view==='ready'?html`<${Gate} k="approve"><button class="btn btn-primary btn-sm" type="button" disabled=${!ready.length} onClick=${generate}>Generate WMC${ready.length?' ('+ready.length+')':''}</button><//>`:null}</div>

/* ================= S.O. COMPLETION (process doc 5.5.1) ================= */
function soChecks(st,o){
  const scope=new Set((o.locs||[]).flatMap(l=>l.blocks).flatMap(b=>BTABLES[b]));
  const c1=o.acts.map(a=>{const rem=a.soQty-mappedQty(st,o.so,a.code); const left=[...scope].filter(t=>!get(st.alloc,o.so,a.code).includes(t)&&!st.sos.some(s=>s.so!==o.so&&s.pid===o.pid&&get(st.alloc,s.so,a.code).includes(t))); const fit=left.filter(t=>tq(a,t)<=rem+1e-9).length; return {a,ok:fit===0,txt:fit?fit+' more tables fit in the remaining '+fmt(roundQ(rem,a.uom))+' '+a.uom:'Nothing more can be mapped'};});
  const c2=o.acts.map(a=>{const m=mappedQty(st,o.so,a.code),u=doneQty(st,o.so,a.code); return {a,ok:Math.abs(m-u)<1e-6,txt:'Mapped '+fmt(m)+' · used '+fmt(u)+' '+a.uom};});
  const open=st.res.filter(r=>r.so===o.so&&['Open','Partially posted','Pending approval'].includes(r.status));
  const mats={}; o.acts.forEach(a=>a.boq.forEach(b=>{const used=get(st.done,o.so,a.code).reduce((s,t)=>s+tq(a,t)*b.per,0); const iss=netIssued(st,o.so,a.code,b.mat); mats[b.mat]=mats[b.mat]||{u:0,i:0}; mats[b.mat].u+=used; mats[b.mat].i+=iss;}));
  const c4=Object.keys(mats).map(m=>({m,ok:Math.abs(mats[m].u-mats[m].i)<0.01,txt:MATS[m].n+': issued '+fmt(roundQ(mats[m].i,MATS[m].u))+' · used '+fmt(roundQ(mats[m].u,MATS[m].u))+' '+MATS[m].u}));
  const rows=[{k:'No more work can be mapped on any activity',ok:c1.every(x=>x.ok),items:c1.filter(x=>!x.ok).map(x=>x.a.name+': '+x.txt)},
    {k:'Mapped quantity equals used quantity for every activity',ok:c2.every(x=>x.ok),items:c2.filter(x=>!x.ok).map(x=>x.a.name+': '+x.txt)},
    {k:'No material requisition is open',ok:!open.length,items:open.map(r=>r.slip+' ('+r.id+') is '+r.status.toLowerCase())},
    {k:'Used quantity equals issued quantity for every material',ok:c4.every(x=>x.ok),items:c4.filter(x=>!x.ok).map(x=>x.txt)}];
  return {rows,ok:rows.every(r=>r.ok)};
}
function SOCompletion({o}){
  const {st,dispatch,toast}=useApp(); const [open,setOpen]=useState(false); const ch=soChecks(st,o); const done=o.status==='Completed';
  return html`<div class=${'card'+(done?' sodone':'')}><div class="card-h"><div style="display:flex;gap:10px;align-items:center"><i class=${'mark '+(done?'done':ch.ok?'done':'pending')}></i><div><h3>S.O. completion</h3><p class="muted" style="font-size:.75rem;margin-top:2px">${done?'Completed in DRS on '+dstr(o.completedOn)+'. SAP closure stays with procurement.':ch.rows.filter(r=>r.ok).length+' of 4 conditions met'}</p></div></div>
    <div style="display:flex;gap:8px;align-items:center">${!done?html`<button class="btn btn-ghost btn-sm" type="button" aria-expanded=${open} onClick=${()=>setOpen(!open)}>${open?'Hide checklist':'Show checklist'}</button><${Gate} k="soComplete"><button class="btn btn-primary btn-sm" type="button" disabled=${!ch.ok} onClick=${()=>{dispatch({t:'soComplete',so:o.so}); toast('ok','S.O. marked completed','SO '+o.so+' is closed in DRS. New allocations and requisitions are locked.')}}>Mark S.O. completed</button><//>`:html`<span class="badge done"><i class="mark done"></i>Completed</span>`}</div></div>
    ${open&&!done?html`<ul class="checks">${ch.rows.map(r=>html`<li class=${r.ok?'ok':''}><span class=${'ck '+(r.ok?'y':'n')} aria-hidden="true">${I(r.ok?'check':'x','sm')}</span><div><b>${r.k}</b>${r.items.length?html`<ul>${r.items.slice(0,4).map(t=>html`<li>${t}</li>`)}${r.items.length>4?html`<li>+${r.items.length-4} more</li>`:null}</ul>`:null}</div></li>`)}</ul>`:null}
  </div>`;
}

function Recon({pid}){
  const {st}=useApp(); const sos=st.sos.filter(s=>s.pid===pid);
  const [so,setSo]=useState('All'); const [ven,setVen]=useState('All'); const [sst,setSst]=useState('All'); const [grp,setGrp]=useState('All');

  const d=hist&&list.find(x=>x.id===hist);
  if(p.id!=='helios'&&!list.length&&!up) return html`<div class="card"><div class="empty"><h4>No drawings for ${p.name}</h4><p>Upload DWG files or sync them from the project's SharePoint folder.</p><${Gate} k="dwg"><button class="btn btn-primary btn-sm" type="button" onClick=${()=>setUp(true)}>Upload drawing</button><//></div></div>`;

function BoqFiles({p}){
  const {st,dispatch,toast}=useApp(); const files=st.boqs.filter(b=>b.pid===p.id);

  const [lines,setLines]=useState(cur?cur.lines.map(l=>({...l})):[]); const [cmt,setCmt]=useState(''); const [err,setErr]=useState(''); const [ask,setAsk]=useState(null); const [add,setAdd]=useState('');
  const [imp,setImp]=useState(false); const [src,setSrc]=useState(''); const [upl,setUpl]=useState(''); const [dupAsk,setDupAsk]=useState(null);

    dispatch({t:'boqSave',id:f.id,lines:lines.map(l=>({...l,qty:Number(l.qty)})),cmt:cmt.trim()}); toast('ok','BoQ saved as v'+(f.versions.length+1),f.name); };
  const others=st.projects.filter(x=>x.id!==p.id&&st.boqs.some(b=>b.pid===x.id));
  const doImport=()=>{const sp=st.projects.find(x=>x.id===src); if(!sp){setErr('Choose a source project.');return;} if(sp.type!==p.type){setErr('Project type mismatch. Import not allowed.');return;}
    const sf=st.boqs.filter(b=>b.pid===sp.id); let skipped=0; sf.forEach(b=>{const v=b.versions.find(x=>x.ver===b.cur); skipped+=v.lines.filter(l=>INACTIVE.has(l.mat)).length;}); dispatch({t:'boqImport',from:sp.id,to:p.id}); setImp(false); setErr('');
    toast(skipped?'warn':'ok','BoQ imported from '+sp.name,sf.length+' files'+(skipped?'. Some BoQ items contain inactive materials/services ('+skipped+' skipped).':'.'));};
  const doUpload=(force)=>{ setErr(''); if(!upl){setErr('Choose a file.');return;} if(!/\.(xlsx|xml)$/i.test(upl)){setErr('Invalid file format. Only Excel (.xlsx) or XML files allowed.');return;}
    if(/dup/i.test(upl)&&!force){setDupAsk(upl);return;} if(!cmt.trim()){setErr('Change reason/comment is mandatory for version update.');return;}
    const nl=cur.lines.map(l=>({...l,qty:roundQ(l.qty*1.04,MATS[l.mat].u)})); if(/dup/i.test(upl)) nl.push({...nl[0]});
    dispatch({t:'boqSave',id:f.id,lines:nl,cmt:cmt.trim()+' (uploaded '+upl+')'}); setDupAsk(null); setUpl(''); toast('ok','BoQ uploaded as v'+(f.versions.length+1),upl);};
  return html`<div class="stack">

    <div class="cfg">

          <div class="tablewrap" style="border:0;border-radius:0"><table><thead><tr><th>Material</th><th>Description</th><th class="r">Qty</th><th>UoM</th><th>WBS</th><th class="r"><span class="sr-only">Remove</span></th></tr></thead><tbody>

          </tbody></table></div>

}
function PrCreate({p}){
  const {st,dispatch,toast}=useApp(); const files=st.boqs.filter(b=>b.pid===p.id);
  const [fid,setFid]=useState(files[0]?files[0].id:''); const [type,setType]=useState('Supply'); const [chk,setChk]=useState({}); const [q,setQ]=useState({}); const [wbs,setWbs]=useState({}); const [err,setErr]=useState('');
  if(!p.linked) return html`<div class="card"><div class="empty"><h4>PR creation needs an SAP link</h4><p>${p.name} is in Pre-Bid. Link it with SAP from the project overview to create purchase requisitions.</p></div></div>`;
  const f=files.find(x=>x.id===fid); const cur=f&&f.versions.find(v=>v.ver===f.cur);
  const prd=m=>st.prs.filter(x=>x.boq===fid&&x.type===type).reduce((t,x)=>t+x.lines.filter(l=>l.mat===m).reduce((a,l)=>a+l.qty,0),0);
  const rows=cur?cur.lines.map(l=>({...l,done:prd(l.mat),left:roundQ(Math.max(0,l.qty-prd(l.mat)),MATS[l.mat].u)})):[];
  const chosen=rows.filter(r=>chk[r.mat]);
  const create=()=>{ setErr(''); if(!chosen.length){setErr('Select at least one BoQ line.');return;}
    for(const r of chosen){const n=Number(q[r.mat]??r.left); if(!(n>0)||n>r.left+1e-9){setErr('Quantity for '+MATS[r.mat].n+' must be between 0 and '+fmt(r.left)+'.');return;} if(!(r.wbs||(wbs[r.mat]||'').trim())){setErr('WBS code is missing for '+MATS[r.mat].n+'. Enter it to create the PR.');return;}}
    dispatch({t:'prCreate',pid:p.id,boq:fid,type,lines:chosen.map(r=>({mat:r.mat,qty:Number(q[r.mat]??r.left),wbs:r.wbs||wbs[r.mat].trim()}))}); setChk({}); setQ({}); toast('ok',type+' PR created in SAP (simulated)',chosen.length+' lines from '+f.name);};
  return html`<div class="stack">
    <div class="card"><div class="card-b cfghead"><div class="field" style="width:260px"><label for="pr-f">BoQ file</label><select class="select" style="height:32px;font-size:.8125rem" id="pr-f" value=${fid} onChange=${e=>{setFid(e.target.value);setChk({})}}>${files.map(x=>html`<option value=${x.id}>${x.name} · v${x.cur}</option>`)}</select></div>
      <div class="field"><span style="font:500 .8125rem var(--font-sans)">PR type</span><div class="tabs" role="tablist" aria-label="PR type">${['Supply','Service'].map(x=>html`<button class="tab" role="tab" type="button" aria-selected=${type===x} onClick=${()=>{setType(x);setChk({})}}>${x}</button>`)}</div></div>
      <div class="cfgacts"><${Gate} k="pr"><button class="btn btn-primary btn-sm" type="button" disabled=${!chosen.length} onClick=${create}>Create ${type} PR${chosen.length?' ('+chosen.length+')':''}</button><//></div></div></div>
    ${err?html`<div class="alert err">${I('alert','sm')}<span>${err}</span></div>`:null}
    ${!files.length?html`<div class="card"><div class="empty"><h4>No BoQ to raise a PR from</h4><p>Add a BoQ first.</p></div></div>`:html`<div class="tablewrap"><table><thead><tr><th><span class="sr-only">Select</span></th><th>Material</th><th>Description</th><th class="r">BoQ qty</th><th class="r">Already in ${type} PRs</th><th class="r">PR qty</th><th>UoM</th><th>WBS</th></tr></thead><tbody>
      ${rows.map(r=>html`<tr key=${r.mat}><td><input class="check" type="checkbox" checked=${!!chk[r.mat]} disabled=${r.left<=0||INACTIVE.has(r.mat)} onChange=${e=>setChk({...chk,[r.mat]:e.target.checked})} aria-label=${'Select '+MATS[r.mat].n}/></td><td class="mono">${r.mat}</td><td>${MATS[r.mat].n}${INACTIVE.has(r.mat)?html` <span class="badge risk">Inactive</span>`:null}</td><td class="r">${fmt(r.qty)}</td><td class="r">${fmt(r.done)}</td>
        <td class="r">${r.left<=0?html`<span class="badge done">Fully raised</span>`:html`<input class="input sm num" type="number" min="0" step="any" value=${q[r.mat]??r.left} disabled=${!chk[r.mat]} aria-label=${'PR quantity for '+MATS[r.mat].n} onInput=${e=>setQ({...q,[r.mat]:e.target.value})}/>`}</td><td>${MATS[r.mat].u}</td>
        <td>${r.wbs?html`<span class="mono">${r.wbs}</span>`:html`<input class="input sm mono" style="width:120px" placeholder="Enter WBS" value=${wbs[r.mat]||''} disabled=${!chk[r.mat]} aria-label=${'WBS for '+MATS[r.mat].n} onInput=${e=>setWbs({...wbs,[r.mat]:e.target.value})}/>`}</td></tr>`)}
    </tbody></table></div>`}
    <div class="card"><div class="card-h"><h3>Purchase requisitions</h3><span class="muted" style="font-size:.75rem">${st.prs.filter(x=>x.pid===p.id).length} PRs</span></div>
      ${st.prs.filter(x=>x.pid===p.id).length?html`<div class="tablewrap" style="border:0;border-radius:0"><table><thead><tr><th>PR no.</th><th>Type</th><th>Date</th><th>BoQ</th><th class="r">Lines</th><th>Status</th></tr></thead><tbody>${st.prs.filter(x=>x.pid===p.id).map(x=>html`<tr key=${x.no}><td class="mono">${x.no}</td><td>${x.type}</td><td>${dstr(x.date)}</td><td>${(st.boqs.find(b=>b.id===x.boq)||{}).name}</td><td class="r">${x.lines.length}</td><td><span class="badge done">Created in SAP</span></td></tr>`)}</tbody></table></div>`:html`<div class="empty"><h4>No PRs yet</h4><p>Select BoQ lines and create a Supply or Service PR.</p></div>`}</div>
  </div>`;
}

const inr=v=>v>=1e7?'₹ '+(v/1e7).toFixed(2)+' Cr':v>=1e5?'₹ '+(v/1e5).toFixed(1)+' L':'₹ '+fmt(Math.round(v),0);
const pctS=(a,b)=>b?Math.round(a/b*100):0;
function useTip(){
  const [tip,setTip]=useState(null);
  const onMove=e=>{const el=e.target.closest('[data-tip]'); if(!el){ if(tip) setTip(null); return;} setTip({t:el.getAttribute('data-tip'),x:e.clientX,y:e.clientY});};
  const node=tip?html`<div class="dtip" role="tooltip" style=${{left:Math.min(tip.x+14,innerWidth-240)+'px',top:(tip.y+14)+'px'}}>${tip.t.split('\n').map((l,i)=>html`<div class=${i?'':'dtip-h'}>${l}</div>`)}</div>`:null;
  return [onMove,()=>setTip(null),node];
}

  const openRes=st.res.filter(r=>sos.some(s=>s.so===r.so)&&['Open','Partially posted','Pending approval'].includes(r.status)); const pendAp=openRes.filter(r=>r.status==='Pending approval').length;

  /* materials */

      <section class="dsec">
        <div class="osec-h"><h3>Needs attention</h3><span class="badge ${att.length?'risk':'done'}">${att.length}</span></div>
        ${att.length?html`<ul class="attn">${att.slice(0,7).map(a=>html`<li><i class=${'mark '+a.k}></i><div><b>${a.t}</b><span>${a.d}</span></div><button class="btn btn-ghost btn-xs" type="button" onClick=${()=>go(a.to)}>${a.k==='blocked'?'Resolve':a.k==='pending'?'Review':'View'}</button></li>`)}</ul>`:html`<p class="muted">Nothing needs attention right now.</p>`}
      </section>
      <section class="dsec">
        <div class="osec-h"><h3>Recent activity</h3></div>
        <ul class="feed">${ev.slice(0,7).map(e=>html`<li><span class=${'fdot f-'+e.k}></span><div><button type="button" class="linkbtn" onClick=${()=>go(e.to)}>${e.t}</button><span>${e.s}</span></div><time>${dstr(e.d)}</time></li>`)}</ul>
      </section>
    </div>

    <section class="dsec">
      <div class="osec-h"><h3>Contractors</h3><button class="btn btn-ghost btn-xs" type="button" onClick=${()=>go('p.'+pid+'.orders')}>All service orders</button></div>
      <div class="tablewrap"><table><thead><tr><th>Contractor</th><th>S.O.</th><th>Package</th><th class="r">S.O. value</th><th>Completed</th><th class="r">Certified</th><th class="r">Open MRs</th><th>Status</th></tr></thead><tbody>
        ${sos.map(s=>{let v=0,d=0; s.acts.forEach(a=>{v+=a.soQty*a.rate; d+=doneQty(st,s.so,a.code)*a.rate;}); const c=st.wmc.filter(w=>w.so===s.so).reduce((t,w)=>t+w.qty*w.rate,0); const om=st.res.filter(r=>r.so===s.so&&['Open','Partially posted','Pending approval'].includes(r.status)).length; const pc=pctS(d,v);
          return html`<tr class="clickable" onClick=${()=>go('so.'+s.so+'.work')}><td>${s.contractor}</td><td class="mono">${s.so}</td><td>${s.pkg}</td><td class="r">${inr(v)}</td><td><div style="display:flex;gap:8px;align-items:center"><div class="meter" style="width:90px"><i style=${'width:'+pc+'%'}></i></div><span class="mono">${pc}%</span></div></td><td class="r">${c?inr(c):'—'}</td><td class="r">${om||'—'}</td><td><span class=${'badge '+(s.status==='Completed'?'done':s.sync==='failed'?'blocked':s.status==='WIP'?'info':'pending')}>${s.sync==='failed'?'Sync failed':s.status}</span></td></tr>`})}
      </tbody></table></div>
    </section>
    ${tipNode}
  <//>`;
}

/* ================= BLOCK STATUS ================= */
function Status({pid}){
  const {st,go}=useApp(); const [f,setF]=useState('All'); const p=st.projects.find(x=>x.id===pid);
  if(pid!=='helios') return html`<${ProjectLayout} pid=${pid} sec="status" crumbs=${[{l:'Block status'}]}><div class="ph"><div><h1>Block status</h1></div></div><div class="card"><div class="empty"><h4>No blocks to track yet</h4><p>Block status starts once the site layout is imported and work is allocated.</p></div></div><//>`;
  const rows=BLOCKS.map(b=>{const g=blockGates(st,b.id,pid);return {b,g,o:overall(g)}});
  const list=rows.filter(r=>f==='All'||(f==='At risk'&&r.o==='risk')||(f==='Blocked'&&r.o==='blocked')||(f==='Complete'&&r.o==='done'));
  const rate=GATES.map((_,i)=>{const app=rows.filter(r=>r.g[i]!=='na'); return Math.round(app.filter(r=>r.g[i]==='done').length/app.length*100)});
  const alerts=[];
  rows.forEach(r=>{ if(r.g[3]==='blocked') alerts.push({k:'blocked',b:r.b.id,t:'Gate order violated',d:'RFI closed before material issue was recorded. Raise a requisition and issue material, or reopen the RFI.',to:'requisition',a:'Open requisition'});
    else if(r.g[2]==='risk') alerts.push({k:'risk',b:r.b.id,t:'Material request is late',d:'Work is allocated but no requisition has been raised for this block.',to:'requisition',a:'Raise requisition'}); });
  const s=new Date(p.start),e=new Date(p.end),pct=Math.max(0,Math.min(100,(DEMO_TODAY-s)/(e-s)*100));
  return html`<${ProjectLayout} pid=${pid} sec="status" crumbs=${[{l:'Block status'}]}>
    <div class="ph"><div><h1>Block status</h1><p>Six gates per block, derived from allocation, requisitions, postings and quality records.</p></div></div>
    <div class="grid2">
      <div class="card"><div class="card-h"><h3>Gate completion</h3></div><div class="card-b" style="display:grid;gap:10px">${GATES.map((g,i)=>html`<div style="display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.8125rem"><span>${g}</span><div class=${'meter'+(rate[i]===100?' green':'')}><i style=${'width:'+rate[i]+'%'}></i></div><span class="mono" style="text-align:right">${rate[i]}%</span></div>`)}</div></div>
      <div class="card"><div class="card-h"><h3>Project duration</h3><span class="muted" style="font-size:.75rem">${Math.round((e-DEMO_TODAY)/864e5)} days left</span></div><div class="card-b timeline"><div class="tl-bar"><i style=${'width:'+pct+'%'}></i><b style=${'left:'+pct+'%'}></b></div><div class="tl-l"><span>${dstr(s)}</span><span>Today ${dstr(DEMO_TODAY)}</span><span>${dstr(e)}</span></div></div></div>
    </div>
    ${alerts.length?html`<div class="card"><div class="card-h"><h3>Needs attention</h3><span class="badge blocked">${alerts.length}</span></div><div class="card-b" style="display:grid;gap:8px">${alerts.map(x=>html`<div class=${'alert '+(x.k==='blocked'?'err':'warn')} style="align-items:center"><i class=${'mark '+x.k}></i><div style="flex:1;min-width:0"><b style="color:var(--foreground)">${x.b} · ${x.t}</b><div style="color:var(--muted-foreground)">${x.d}</div></div><button class="btn btn-outline btn-xs" type="button" onClick=${()=>go(x.to)}>${x.a}</button></div>`)}</div></div>`:null}
    <div class="card"><div class="card-h"><h3>Block status matrix</h3><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><div class="legend"><span><i class="mark done"></i>Done</span><span><i class="mark risk"></i>Late</span><span><i class="mark blocked"></i>Violation</span><span><i class="mark pending"></i>Pending</span></div>
      <div class="tabs" role="tablist" aria-label="Filter">${['All','At risk','Blocked','Complete'].map(x=>html`<button class="tab" role="tab" type="button" aria-selected=${f===x} onClick=${()=>setF(x)}>${x}</button>`)}</div></div></div>
      ${list.length?html`<div class="tablewrap" style="border:0;border-radius:0"><table><thead><tr><th>Block</th><th>Plot</th><th class="r">Tables</th>${GATES.map(g=>html`<th class="c">${g}</th>`)}<th>Status</th></tr></thead><tbody>
        ${list.map(r=>html`<tr key=${r.b.id}><td class="mono">${r.b.id}</td><td>${(PLOTS.find(p=>p.blocks.includes(r.b.id))||{}).id||'–'}</td><td class="r">${BTABLES[r.b.id].length}</td>${r.g.map(x=>html`<td class="c"><i class=${'mark '+x} title=${GLAB[x]}></i><span class="sr-only">${GLAB[x]}</span></td>`)}<td><span class=${'badge '+OBADGE[r.o]}>${['done','risk','blocked'].includes(r.o)?html`<i class=${'mark '+r.o}></i>`:null}${OLAB[r.o]}</span></td></tr>`)}
      </tbody></table></div>`:html`<div class="empty"><h4>No blocks in this state</h4><p>Choose another filter.</p></div>`}</div>
  <//>`;
}

/* ================= APP ================= */
function App(){
  const [st,dispatch]=useReducer(reducer,null,init);
  const [hh,go]=useHashRoute();
  const [toasts,setToasts]=useState([]);
  const toast=useCallback((kind,title,body)=>{const id=Math.random().toString(36).slice(2); setToasts(t=>[...t.slice(-2),{id,kind,title,body}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),4200)},[]);
  const dismiss=id=>setToasts(t=>t.filter(x=>x.id!==id));
  const ix=useMemo(()=>buildIdx(st),[st]);
  const r=parse(hh,st);
  const ctx={st,ix,dispatch,go,toast};
  let view;
  if(!st.user||r.v==='login') view=html`<${Login}/>`;
  else if(r.v==='projects') view=html`<${Projects}/>`;
  else if(r.v==='roles') view=html`<${RolesPage}/>`;
  else if(r.v==='pform') view=html`<${ProjectForm} id=${r.id}/>`;
  else if(r.v==='project'&&st.projects.some(p=>p.id===r.id)) view=r.sec==='orders'?html`<${Orders} pid=${r.id}/>`:r.sec==='status'?html`<${Status} pid=${r.id}/>`:r.sec==='dash'?html`<${Dashboard} pid=${r.id}/>`:r.sec==='boq'?html`<${Engineering} pid=${r.id} tab="gen"/>`:r.sec==='eng'?html`<${Engineering} pid=${r.id} tab=${r.tab}/>`:r.sec==='recon'?html`<${Recon} pid=${r.id}/>`:r.sec==='wmc'?html`<${Wmc} pid=${r.id}/>`:html`<${Overview} pid=${r.id}/>`;
  else if(r.v==='map') view=html`<${MapScreen} key=${r.so+r.act+r.mode} so=${r.so} act=${r.act} mode=${MODES.some(m=>m[0]===r.mode)?r.mode:'alloc'}/>`;
  else if(r.v==='so') view=html`<${SODetail} so=${r.so} tab=${SOTABS.some(t=>t[0]===r.tab)?r.tab:'config'}/>`;
  else view=html`<${Projects}/>`;
  return html`<${Ctx.Provider} value=${ctx}>${view}<${Toasts} items=${toasts} dismiss=${dismiss}/><//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();

</script>
